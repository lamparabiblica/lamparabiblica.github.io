}

/* =========================================================
   PRUEBA DE NIVEL (solo al crear un usuario nuevo)
   10 preguntas de tres franjas de dificultad, todas escritas (sin opción múltiple,
   para que no se pueda adivinar): completar palabras, terminar el versículo y escribir la cita
   ========================================================= */
let PLACE = null;
const LEVELS = [
  { key:"Principiante", min:0,   unlock:5,  desc:"Empiezas con los versículos más conocidos." },
  { key:"Intermedio",   min:.35, unlock:15, desc:"Ya conoces varios; arrancas con un plan más amplio." },
  { key:"Avanzado",     min:.7,  unlock:30, desc:"Tienes buena base; vas directo a pasajes más largos." }
];
function startPlacement(){
  // 3 básicos + 3 intermedios + 4 avanzados; en cada franja hay de los tres tipos
  const bands = [[0,20,["blanks","finish","ref"]],[20,40,["blanks","finish","ref"]],[40,SUGGESTED.length,["blanks","finish","ref","finish"]]];
  const items = [];
  bands.forEach(([a,b,types])=>{
    const ids = shuffle(SUGGESTED.slice(a,b).map(r=>r[0])).slice(0,types.length);
    shuffle(types).forEach((type,k)=>items.push({ id:ids[k], type }));
  });
  items.forEach(it=>{
    const v = verse(it.id);
    if(it.type==="blanks"){
      const toks = v.text.split(/(\s+)/); const cand = [];
      toks.forEach((t,i)=>{ if(norm(t).length>=3) cand.push(i); });
      it.toks = toks; it.blanks = shuffle(cand).slice(0, Math.max(2, Math.round(cand.length*.4))).sort((a,b)=>a-b);
    } else if(it.type==="finish"){
      const w = v.text.split(/\s+/); const cut = Math.max(2, Math.min(w.length-3, Math.round(w.length*.4)));
      it.start = w.slice(0,cut).join(" "); it.rest = w.slice(cut).join(" ");
    }
  });
  PLACE = { phase:"intro", i:0, items, scores:[], answered:false };
  VIEW = { name:"placement" }; render(); window.scrollTo({top:0});
}

function placementAnswer(score, html){
  const P = PLACE; if(P.answered) return;
  P.answered = true; P.scores[P.i] = score;
  const last = P.i===P.items.length-1;
  $("#plFeedback").innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${html||""}<div class="row"><span style="flex:1"></span><button class="btn primary" id="plNext" data-act="pl-next">${last?"Ver mi nivel":"Siguiente"}</button></div></div>`;
  const a = $("#plActs"); if(a) a.remove();
  const n = $("#plNext"); if(n) n.focus();
}
function placementCheck(){
  const P = PLACE, it = P.items[P.i]; if(P.answered) return;
  const v = verse(it.id);
  if(it.type==="blanks"){
    let ok = 0;
    it.blanks.forEach(i=>{
      const el = root.querySelector(`[data-pblank="${i}"]`);
      const right = norm(el.value) && close(norm(el.value), norm(it.toks[i]));
      if(right) ok++;
      el.classList.add(right?"right":"wrong"); el.disabled = true;
      if(!right){ const f=document.createElement("span"); f.className="fix"; f.textContent=it.toks[i].replace(/[.,;:!?¿¡"«»()]/g,""); el.after(f); }
    });
    const sc = ok/it.blanks.length;
    placementAnswer(sc, `<div class="result-bar ${sc>=.9?"ok":sc>=.6?"mid":"bad"}"><b>${Math.round(sc*100)}%</b><span>${ok} de ${it.blanks.length} palabras</span></div>`);
  } else if(it.type==="finish"){
    const el = $("#plText"), val = el.value.trim();
    if(!val){ toast("Escribe cómo sigue o toca “No lo conozco”."); el.focus(); return; }
    el.disabled = true;
    const r = scoreFreeText(it.rest, val), sc = r.score;
    placementAnswer(sc, `<div class="result-bar ${sc>=.9?"ok":sc>=.6?"mid":"bad"}"><b>${Math.round(sc*100)}%</b><span>${sc>=.9?"¡Lo sabes!":sc>=.6?"Casi.":"Sigue practicando."} En esta prueba no cuentan tildes ni signos.</span></div><p class="diff" style="font-size:17px">${esc(it.start)} ${r.html}</p>`);
  } else {
    const el = $("#plRef"), val = el.value.trim();
    if(!val){ toast("Escribe la cita o toca “No lo sé”."); el.focus(); return; }
    el.disabled = true;
    const ok = refMatch(v.ref, val);
    const book = v.ref.replace(/\s+\d.*$/,"");
    const bookOk = !ok && norm(val).startsWith(norm(book));
    const sc = ok ? 1 : bookOk ? 0.5 : 0;
    el.classList.add(ok?"ref-ok":"ref-bad");
    placementAnswer(sc, `<div class="result-bar ${ok?"ok":bookOk?"mid":"bad"}"><span>${ok?"¡Correcto!":bookOk?"El libro es correcto, pero el capítulo o versículo no.":"No es esa."} La cita es <b style="font-size:inherit">${esc(v.ref)}</b>.</span></div>`);
  }
}
function finishPlacement(){
  const P = PLACE, now = Date.now();
  const avg = P.scores.reduce((a,b)=>a+(b||0),0)/P.items.length;
  const level = LEVELS.slice().reverse().find(l=>avg>=l.min);
  let memo=0, refs=0, known=0, maxIdx=-1;
  P.items.forEach((it,k)=>{
    const sc = P.scores[k]||0; let box = 0;
    if(it.type==="blanks" || it.type==="finish"){ if(sc>=.9){ box=3; memo++; } else if(sc>=.6){ box=1; memo+=.5; } }
    else if(sc>=1){ box=1; refs++; }
    if(box){
      known++; maxIdx = Math.max(maxIdx, SUG_MAP[it.id].order);
      S.progress[it.id] = { box, due: dayStart(now, INTERVAL_DAYS[box]), reps:1, lapses:0, last:now, introduced:now, hist:[Math.round(sc*100)], placed:true };
    }
  });
  S.unlocked = Math.min(SUGGESTED.length, level.unlock);
  S.extraActive = Object.keys(S.progress).filter(id=>SUG_MAP[id] && SUG_MAP[id].order>=S.unlocked);
  S.placed = { level:level.key, score:Math.round(avg*100), date:todayKey() };
  persist();
  P.result = { avg, level, memo:Math.floor(memo), refs, known, memoN:P.items.filter(x=>x.type!=="ref").length, refN:P.items.filter(x=>x.type==="ref").length };
  P.phase = "done"; render(); window.scrollTo({top:0});
}

function bookStat(name){ return (S.books||{})[name] || { ok:0, n:0, streak:0 }; }
function bookMastered(name){ return bookStat(name).streak >= 3; }
function divMastery(d){ const b=DIV_MAP[d].books; return Math.round(b.filter(([n])=>bookMastered(n)).length / b.length * 100); }
function scopeBooks(scope){
  if(scope==="AT"||scope==="NT") return BOOKS.filter(b=>b.t===scope);
  if(DIV_MAP[scope]) return BOOKS.filter(b=>b.div===scope);
  return BOOKS;
}
function pickBook(pool){
  const ws = pool.map(b=>{ const s=bookStat(b.name); return (s.streak>=3?1:6-Math.min(s.streak,3)*1.5) * (s.n? 1 : 1.4) * (0.6+Math.random()*0.8); });
  let r = Math.random()*ws.reduce((a,c)=>a+c,0), k=0; while(k<ws.length-1 && (r-=ws[k])>0) k++;
  return pool[k];
}
function nearbyNames(b, excl, n=3){
  const cands = BOOKS.filter(x=>!excl.includes(x.name) && Math.abs(x.i-b.i)<=6).map(x=>x.name);
  const pool = shuffle(cands).slice(0,n);
  while(pool.length<n){ const x=BOOKS[Math.floor(Math.random()*BOOKS.length)].name; if(!excl.includes(x)&&!pool.includes(x)) pool.push(x); }
  return pool;
}

/* Opciones numéricas cercanas y distintas (sin repetir y mayores que 0) */
function numOpts(right, spread){
  const set = new Set([right]); let guard = 0;
  const steps = spread || (right<=6 ? [1,2,3,4] : right<=30 ? [2,3,4,5,6,8] : right<=80 ? [4,6,8,10,12,15] : [10,14,20,26,30]);
  while(set.size<4 && guard++<60){ const d = steps[Math.floor(Math.random()*steps.length)] * (Math.random()<.5?-1:1); const v = right+d; if(v>0) set.add(v); }
  for(let v=right+1; set.size<4; v++) set.add(v);
  return shuffle([...set].map(String));
}

    const last = Math.random()<.5; const ans = last ? d.books[d.books.length-1][0] : d.books[0][0];
    const wrong = shuffle(d.books.map(x=>x[0]).filter(x=>x!==ans)).slice(0,3);
    return { sig:(last?"last:":"first:")+d.id, books:[ans], prompt:`¿Cuál es el <b>${last?"último":"primer"}</b> libro ${esc(deDn(d))}?`, answer:ans, opts:shuffle([ans, ...wrong]), explain:`${d.name}: ${d.books.map(x=>x[0]).join(", ")}.` }; },
  count(pool, scope, b){
    if(DIV_MAP[scope]) return null;
    const d = DIVS.filter(x=>scope==="all" || x.t===scope)[Math.floor(Math.random()*DIVS.filter(x=>scope==="all"||x.t===scope).length)];
    const n = d.books.length; if(n<2) return null;
    return { sig:"count:"+d.id, books:[], prompt:`¿Cuántos libros tienen <b>${esc(dn(d))}</b>?`.replace("tienen <b>el ","tiene <b>el "), answer:String(n), opts:numOpts(n,[1,2,3,4]), explain:`${d.name} tiene ${n} libros: ${d.books.map(x=>x[0]).join(", ")}.` }; },
  order(pool, scope, b){
    // siempre la sección completa (nunca libros sueltos de dos secciones)
    const divs = DIV_MAP[scope] ? [DIV_MAP[scope]] : DIVS.filter(d=>d.books.length>=3 && (scope==="all" || d.t===scope));
    const d = divs[Math.floor(Math.random()*divs.length)]; if(!d || d.books.length<3) return null;
    const seq = d.books.map(x=>x[0]);
    let mixed = shuffle(seq), g = 0; while(mixed.join()===seq.join() && g++<5) mixed = shuffle(seq);
    return { type:"order", sig:"order:"+d.id, books:seq, prompt:`Ordena los <b>${seq.length} libros ${esc(deDn(d))}</b>: tócalos en el orden en que aparecen en la Biblia`, answer:seq, opts:mixed, picked:[], explain:`${d.name}: ${seq.join(", ")}.` }; }
};
const BOOK_WEIGHTS = { next:3, prev:2, gap:2, chapters:4, whichCh:2, mostCh:2, verses:4, position:2, div:2, edge:2, count:1 };
/* Máximo por ronda de cada tipo, para que ninguna pregunta se sienta repetida */
const BOOK_MAX = { next:2, prev:2, gap:1, chapters:3, whichCh:1, mostCh:1, verses:3, position:1, div:2, edge:1, count:1 };
/* Arma una ronda sin preguntas repetidas y sin repetir el mismo libro, con un ejercicio de ordenar la sección completa */
function makeBookSession(scope, n, { noOrder=false } = {}){
  const pool = scopeBooks(scope);
  const out = [], sigs = new Set(), usedBooks = new Map();
  const typesUsed = {};
  const weighted = Object.entries(BOOK_WEIGHTS).flatMap(([t,w])=>Array(w).fill(t));
  let guard = 0;
  while(out.length < (noOrder ? n : n-1) && guard++ < 400){
    const type = weighted[Math.floor(Math.random()*weighted.length)];
    if((typesUsed[type]||0) >= BOOK_MAX[type]) continue;                    // variedad: ningún tipo se repite de más
    const b = pickBook(pool);
    if((usedBooks.get(b.name)||0) >= (pool.length<=5 ? 2 : 1) && guard < 300) continue;
    const q = BOOK_GEN[type](pool, scope, b);
    if(!q || sigs.has(q.sig)) continue;
    sigs.add(q.sig); typesUsed[type] = (typesUsed[type]||0)+1;
    q.books.forEach(x=>usedBooks.set(x, (usedBooks.get(x)||0)+1));
    out.push(Object.assign({ type }, q));
  }
  if(!noOrder){ const o = BOOK_GEN.order(pool, scope, null); if(o) out.splice(1+Math.floor(Math.random()*(out.length)), 0, o); }
  // secciones de un solo libro (Hechos, Apocalipsis) tienen pocos datos: la ronda es más corta en lugar de repetir
  return out.slice(0, n);
}
function makeBookQuestion(scope){ return makeBookSession(scope, 1, { noOrder:true })[0]; }

function makeTriviaSession(n){
  const order = shuffle(TRIVIA.map((_,i)=>i));
  const recent = new Set(S.triviaRecent||[]);
  const fresh = order.filter(i=>!recent.has(i)), old = order.filter(i=>recent.has(i));
  return fresh.concat(old).slice(0,n).map(i=>{ const [q,a,w,ref]=TRIVIA[i]; return { type:"trivia", idx:i, books:[], prompt:esc(q), answer:a, opts:shuffle([a,...w]), explain:ref?`Lo encuentras en ${ref}.`:"" }; });
}
function startBooks(kind, scope){

function recordBook(names, ok){
  S.books = S.books || {};
  names.forEach(n=>{ const s=Object.assign({ok:0,n:0,streak:0}, S.books[n]); s.n++; if(ok){ s.ok++; s.streak++; } else s.streak=0; S.books[n]=s; });
}
function answerBook(ok){
  const q = BQ.qs[BQ.i]; if(BQ.answered) return;
  BQ.answered = true; q.ok = ok; if(ok){ BQ.score++; gainXP(3); }
  if(BQ.kind==="books") recordBook(q.type==="order"?q.answer:q.books, ok);
  markToday();
  const k = todayKey(); const L = S.log[k] || { n:0, sum:0 }; L.n++; L.sum += ok?1:0; S.log[k] = L;
  persist();
  render();
}

const TOPIC_MAP = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
let TOPIC_QUERY = "";
function topicMatches(t, q){
  if(!q) return true;
  const n = norm(q);
  if(norm(t.name+" "+t.desc).includes(n)) return true;
  return t.ids.some(id=>{ const v=verse(id); return v && (norm(v.ref).includes(n) || norm(v.text).includes(n)); });
}
function topicCards(q){
  const list = TOPICS.filter(t=>topicMatches(t,q));
  if(!list.length) return `<div class="empty"><b>No encontramos temas con “${esc(q)}”</b><span>Prueba con otra palabra, como paz, perdón o salvación.</span></div>`;
  return `<div class="lists-grid">${list.map(t=>{ const done=t.ids.filter(id=>status(id)==="ok").length; return `<button class="lcard" data-act="open-topic" data-id="${t.id}"><div class="cv ${t.cv}"><span>${esc(t.glyph)}</span></div><div><b>${esc(t.name)}</b><br><small>${t.ids.length} versículos${done?` · ${done} aprendidos`:""}</small></div></button>`; }).join("")}</div>`;
}

/* Rachas: personal (desde la actividad) y compartida (los dos el mismo día) */
function runOfDays(has){
  let d = new Date(), n = 0;
  if(!has(d)) d = new Date(Date.now() - DAY);
  while(has(d)){ n++; d = new Date(d.getTime() - DAY); }
  return n;
}
function sharedStreak(daysA, daysB){ daysA = daysA || new Set(); daysB = daysB || new Set(); return runOfDays(x => daysA.has(dayKey(x)) && daysB.has(dayKey(x))); }
function soloStreak(days){ days = days || new Set(); return runOfDays(x => days.has(dayKey(x))); }
function daysInLast(days, n){ days = days || new Set(); let c = 0; for(let i=0;i<n;i++) if(days.has(dayKey(new Date(Date.now() - i*DAY)))) c++; return c; }

async function loadCommunity(){
  if(!cloudOn() || COMM.loading) return;
  COMM.loading = true; COMM.err = "";
  try{
    COMM.friends = await API.myFriends();
    COMM.friends.forEach(f=>COMM.profiles[f.user_id] = f);
    COMM.duels = await API.myDuels();
    const missing = COMM.duels.flatMap(d=>[d.creator, d.opponent]).filter(x=>x && x!==ME.id && !COMM.profiles[x]);
    if(missing.length) (await API.profiles(missing)).forEach(p=>COMM.profiles[p.user_id] = p);
    const ids = [ME.id, ...friendsAccepted().map(f=>f.user_id)];
    const rows = await API.days(ids, dayKey(new Date(Date.now() - 60*DAY)));
    COMM.days = {}; ids.forEach(id=>COMM.days[id] = new Set());
    rows.forEach(r=>{ (COMM.days[r.user_id] = COMM.days[r.user_id] || new Set()).add(r.day); });
    COMM.counts[ME.id] = friendsAccepted().length;
    COMM.loaded = true;

}

function notifError(e){
  const m = String((e && e.message) || e || "");
  if(/send_message/i.test(m)) return "Falta activar los mensajes en Supabase (código SQL 05_mensajes).";
  if(/nota_muy_larga/.test(m)) return "La nota es muy larga: máximo 140 caracteres.";
  if(/mensaje_vacio/.test(m)) return "Elige un mensaje, escribe el tuyo o agrega un versículo.";
  if(/versiculo_invalido|mensaje_invalido/.test(m)) return "No se pudo enviar ese mensaje. Elige otro versículo o mensaje.";
  if(/notif|push_|send_cheer|invite_streak|vapid|Could not find the (table|function)|does not exist/i.test(m)) return "Falta activar Avisos en Supabase (código SQL de Avisos).";
  if(/demasiados_animos/.test(m)) return "Ya le enviaste 5 mensajes hoy a esta persona. Mañana puedes enviar más.";
  if(/no_son_amigos/.test(m)) return "Solo puedes hacer esto con tus amigos.";
  return commError(e);
}

/* ----- Avisos en el celular ----- */
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && window.isSecureContext;
function b64ToU8(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); s += "===".slice((s.length+3)%4); const r = atob(s); return Uint8Array.from(r, c=>c.charCodeAt(0)); }
async function swReg(){ return navigator.serviceWorker.register("sw.js"); }
async function refreshPushState(){
  let st;
  if(!pushSupported()) st = isIOS() && !isStandalone() ? "ios-install" : "unsupported";
  else if(Notification.permission==="denied") st = "denied";
  else{
    try{ const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
      st = sub && Notification.permission==="granted" && LS.get("lampara.push."+ME.id, null)===sub.endpoint ? "on" : "off"; }catch(e){ st = "off"; }
  }
  if(st!==NOTIF.push){ NOTIF.push = st; if(VIEW.name==="profile" || VIEW.name==="avisos") render(); }
}
async function enablePush(btn){
  if(!pushSupported()){ refreshPushState(); toast(isIOS() ? "En iPhone, primero agrega Ner a tu pantalla de inicio." : "Este navegador no permite avisos. Prueba con Chrome."); return; }
  if(btn){ btn.disabled = true; btn.textContent = "Activando…"; }
  try{
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ NOTIF.push = perm==="denied" ? "denied" : "off"; render(); toast("No diste permiso para los avisos."); return; }
    const reg = await swReg(); await navigator.serviceWorker.ready;
    let key = await NAPI.vapidKey();
    if(!key){ try{ key = await NAPI.initPush(); }catch(e){ key = null; } }
    if(!key) throw new Error("Falta instalar la función de avisos (push) en Supabase.");
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(key) });
    await NAPI.saveSub(sub.toJSON());
    LS.set("lampara.push."+ME.id, sub.endpoint);
    NOTIF.push = "on"; render(); toast("¡Listo! Te llegarán los avisos a este dispositivo.");
  }catch(e){ if(btn){ btn.disabled = false; } NOTIF.push = "off"; render(); toast("No se pudieron activar: " + notifError(e)); }
}
async function disablePush(){
  try{ const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
    if(sub){ try{ await NAPI.removeSub(sub.endpoint); }catch(e){} await sub.unsubscribe(); } }catch(e){}
  LS.set("lampara.push."+ME.id, null); NOTIF.push = "off"; render(); toast("Ya no te llegarán avisos a este dispositivo.");
}
/* Al cerrar sesión, este dispositivo deja de recibir los avisos de esa cuenta */
async function detachPushOnSignOut(){
  if(!ME || !pushSupported()) return;
  try{ const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
    if(sub && LS.get("lampara.push."+ME.id, null)===sub.endpoint){ await NAPI.removeSub(sub.endpoint); await sub.unsubscribe(); LS.set("lampara.push."+ME.id, null); } }catch(e){}
}
if(pushSupported()){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("message", e=>{ if(e.data && e.data.ir==="avisos" && cloudOn()){ loadNotifs(); go("avisos"); } });
}

function timeAgo(iso){
  const s = Math.max(1, Math.round((Date.now() - new Date(iso).getTime())/1000));
  if(s < 60) return "ahora"; const m = Math.round(s/60); if(m < 60) return `hace ${m} min`;
  const h = Math.round(m/60); if(h < 24) return `hace ${h} h`; const d = Math.round(h/24); if(d < 7) return d===1 ? "ayer" : `hace ${d} días`;
  return new Date(iso).toLocaleDateString("es", { day:"numeric", month:"short" });
}

function streakDays(f){

  const a = COMM.days[ME.id] || new Set(), b = COMM.days[f.user_id] || new Set();

}


/* =========================================================
   CAMINO POR NIVELES + PUNTOS DE EXPERIENCIA
   - El camino tiene etapas de 6 versículos, del más corto y conocido al más largo.
   - Cada 3 etapas cambia la fase (Semilla → Lámpara) y sube la dificultad:
     menos tarjetas, más palabras ocultas y más escribir o recitar de memoria.
   - En cada práctica del camino, 1 de cada 4 preguntas repasa lo ya aprendido.
   ========================================================= */
const PATH_SIZE = 6;
const TIERS = [
  { name:"Semilla", em:"🌱", c1:"#22B573", c2:"#14935A", note:"Versículos cortos, con tarjetas y muchas pistas.", ref:"«La semilla es la palabra de Dios» (Lucas 8:11)" },
  { name:"Raíz", em:"🌿", c1:"#2FB5A0", c2:"#168A7B", note:"Menos pistas: más palabras por completar.", ref:"«Arraigados y cimentados en amor» (Efesios 3:17)" },
  { name:"Árbol", em:"🌳", c1:"#2F6FED", c2:"#1F4FC4", note:"Empiezas a escribir versículos completos.", ref:"«Será como árbol plantado junto a corrientes de aguas» (Salmos 1:3)" },
  { name:"Fruto", em:"🍇", c1:"#7C5CFF", c2:"#5A3BDB", note:"Versículos más largos y casi sin tarjetas.", ref:"«El que permanece en mí… lleva mucho fruto» (Juan 15:5)" },
  { name:"Luz", em:"✨", c1:"#FF8A00", c2:"#E06A00", note:"Escribir y recitar de memoria.", ref:"«Vosotros sois la luz del mundo» (Mateo 5:14)" },
  { name:"Lámpara", em:"🪔", c1:"#E5484D", c2:"#B8323A", note:"El reto final: pasajes largos, de memoria.", ref:"«Lámpara es a mis pies tu palabra» (Salmos 119:105)" }
];
function pathIds(){ return Object.values(SUG_MAP).sort((a,b)=>a.order-b.order).map(v=>v.id); }
function stageCount(){ return Math.ceil(pathIds().length / PATH_SIZE); }
function stageIds(k){ return pathIds().slice(k*PATH_SIZE, (k+1)*PATH_SIZE); }
function tierOf(k){ return Math.min(TIERS.length-1, Math.floor(k/3)); }
function verseCleared(id){ const p = prog(id); return !!p && (p.box>=2 || (p.hist||[]).filter(x=>x>=90).length>=2); }
function stageDone(k){ return stageIds(k).every(verseCleared); }
function currentStage(){ const n = stageCount(); for(let k=0;k<n;k++) if(!stageDone(k)) return k; return n; }
/* La dificultad de toda la app sigue la fase del camino en la que vas */
/* Ritmo elegido por la persona: tiempo diario, versículos nuevos por semana y dificultad */
const RITMOS = {
  tranquilo:{ label:"Tranquilo", em:"🌱", min:5,  week:2, off:-1, desc:"5 min al día · 1 o 2 versículos nuevos por semana · más tarjetas y pistas, con un reto de vez en cuando" },
  constante:{ label:"Constante", em:"🔥", min:10, week:4, off:0,  desc:"10 min al día · 3 o 4 versículos nuevos por semana · la dificultad normal del camino" },
  intensivo:{ label:"Intensivo", em:"⚡", min:20, week:7, off:1,  desc:"20 min al día · 1 versículo nuevo por día · más escribir y recitar de memoria" }
};
// quienes se registraron antes de elegir ritmo: se deduce de los minutos que escogieron
const ritmo = () => { if(!S || !S.prefs) return "constante"; if(RITMOS[S.prefs.ritmo]) return S.prefs.ritmo; const m = S.prefs.minutes || 10; return m <= 5 ? "tranquilo" : m >= 20 ? "intensivo" : "constante"; };
function diffTier(){ return Math.max(0, Math.min(TIERS.length-1, tierOf(Math.min(currentStage(), stageCount()-1)) + RITMOS[ritmo()].off)); }
/* Cuántos versículos nuevos puedes empezar aún esta semana según tu ritmo */
function newBudget(){
  const since = Date.now() - 7*DAY;
  const started = Object.values(S.progress||{}).filter(p=>p && !p.placed && p.introduced && p.introduced >= since && p.reps>0).length;   // los que ya sabías en la prueba de nivel no cuentan
  return Math.max(0, RITMOS[ritmo()].week - started);
}
function limitNew(ids, keepAtLeast){
  let left = newBudget();
  const out = ids.filter(id=>{ if(prog(id)) return true; if(left>0){ left--; return true; } return false; });
  return out.length >= (keepAtLeast||1) ? out : ids.slice(0, Math.max(keepAtLeast||1, out.length));
}
/* Asegura que los versículos de la etapa actual estén en tu plan */
function syncPath(){
  if(!S) return;
  const k = Math.min(currentStage(), stageCount()-1);
  const ids = stageIds(k);
  let changed = false;
  ids.forEach(id=>{
    const o = SUG_MAP[id].order;
    if(o < SUGGESTED.length){ if(o >= S.unlocked){ S.unlocked = o+1; changed = true; } }
    else if(!(S.extraActive||[]).includes(id)){ S.extraActive = (S.extraActive||[]).concat(id); changed = true; }
  });
  return changed;
}
function pathQueue(size){
  const k = Math.min(currentStage(), stageCount()-1);
  syncPath();
  const now = Date.now();
  const stage = stageIds(k);
  const nRev = Math.max(1, Math.round(size/4));
  const learned = activeIds().filter(id=>!stage.includes(id) && (verseCleared(id) || status(id)==="ok"));
  const rev = weightedSample(learned.filter(id=>isDue(id,now)).concat(learned.filter(id=>!isDue(id,now))), Math.min(nRev, learned.length), now);
  const pending = limitNew(stage.filter(id=>!verseCleared(id)), Math.min(2, stage.length)), cleared = stage.filter(verseCleared);
  let main = weightedSample(pending, Math.min(pending.length, size-rev.length), now);
  if(main.length < size-rev.length) main = main.concat(weightedSample(cleared, size-rev.length-main.length, now));
  return shuffle(main.concat(rev));
}

/* Puntos de experiencia (XP) y nivel */
function lvlFloor(n){ return 25*(n-1)*n; }               // nivel 2 = 50 XP, 3 = 150, 4 = 300, 5 = 500…
function levelOf(xp){ let n = 1; while(xp >= lvlFloor(n+1)) n++; return n; }
function ensureXP(){
  if(S.xp != null) return;
  let x = 0; Object.values(S.log||{}).forEach(L=>{ x += Math.round((L.sum||0)*10 + Math.max(0,(L.n||0)-(L.sum||0))*3); });
  S.xp = x;
}
function xpFor(score, mode){
  const base = score>=0.9 ? 10 : score>=0.6 ? 6 : 2;
  const bonus = (mode==="write" || mode==="recite") && score>=0.6 ? 4 : 0;
  return base + bonus + diffTier();
}
function gainXP(n){
  ensureXP();
  const before = levelOf(S.xp);
  S.xp += n;
  const k = todayKey(); const L = S.log[k] || { n:0, sum:0 }; L.xp = (L.xp||0) + n; S.log[k] = L;
  if(SESSION) SESSION.xp = (SESSION.xp||0) + n;
  const after = levelOf(S.xp);
  if(after > before){ S._levelUp = after; setTimeout(()=>{ if(S && S._levelUp){ toast(`¡Subiste al nivel ${S._levelUp}! Sigue así.`); S._levelUp = null; } }, 600); }
}
function xpInfo(){
  ensureXP();
  const lv = levelOf(S.xp), lo = lvlFloor(lv), hi = lvlFloor(lv+1);
  return { lv, xp:S.xp, into:S.xp-lo, need:hi-lo, pct:Math.round((S.xp-lo)/(hi-lo)*100), today:(S.log[todayKey()]||{}).xp||0 };
}
/* Revisa si terminaste una etapa al acabar una práctica */
function checkStageAdvance(before){
  const now = currentStage();
  if(now > before){
    gainXP(30*(now-before));
    syncPath();
    return now - before;
  }
  return 0;
}

function bestStreak(){
  const keys = [...new Set(Object.keys(S.log||{}).filter(k=>S.log[k] && S.log[k].n).concat(S.shieldDays||[]))].sort();
  let best = 0, run = 0, prev = null;
  keys.forEach(k=>{ const d = new Date(k+"T12:00:00"); run = prev && Math.round((d-prev)/DAY)===1 ? run+1 : 1; best = Math.max(best, run); prev = d; });
  return best;
}
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

/* Versículos que más te cuestan: fallos, respuestas “casi” y promedio reciente bajo */
function difficulty(id){
  const p = prog(id); if(!p || !p.reps) return 0;
  const h = (p.hist||[]).slice(-5); const avg = h.length ? h.reduce((a,b)=>a+b,0)/h.length : 100;
  return (p.lapses||0)*30 + Math.max(0, 95-avg);
}
function hardestIds(ids){ return ids.filter(id=>difficulty(id) > 5).sort((a,b)=>difficulty(b)-difficulty(a)).slice(0,5); }

/* Ajustar la foto dentro del círculo (arrastrar y acercar, como en WhatsApp) */
function cropModal(file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onerror = ()=>{ URL.revokeObjectURL(url); toast("Ese archivo no es una imagen válida."); };
  img.onload = ()=>{
    modal(`
      <div class="spread" style="flex-wrap:nowrap"><h2 style="font-size:22px">Ajusta tu foto</h2><button class="icon-btn" data-close aria-label="Cerrar">${I.x}</button></div>
      <p class="muted" style="font-size:14px">Arrastra la foto para moverla y usa la barra para acercarla.</p>
      <div class="crop" id="cropBox"></div>
      <div class="row" style="gap:10px;flex-wrap:nowrap"><span aria-hidden="true">−</span><input type="range" class="zoom" id="cropZoom" min="1" max="4" step="0.01" value="1" aria-label="Acercar"><span aria-hidden="true">+</span></div>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="cropOk">Usar foto</button></div>`, sc=>{
      const box = sc.querySelector("#cropBox"), z = sc.querySelector("#cropZoom");
      box.appendChild(img);
      const W = () => box.clientWidth;
      const base = () => W() / Math.min(img.naturalWidth, img.naturalHeight);
      let scale = 1, x = 0, y = 0;
      const clamp = ()=>{ const s = base()*scale, w = img.naturalWidth*s, h = img.naturalHeight*s; x = Math.min(0, Math.max(W()-w, x)); y = Math.min(0, Math.max(W()-h, y)); };
      const draw = ()=>{ clamp(); img.style.transform = `translate(${x}px,${y}px) scale(${base()*scale})`; };
      const center = ()=>{ const s = base()*scale; x = (W()-img.naturalWidth*s)/2; y = (W()-img.naturalHeight*s)/2; draw(); };
      requestAnimationFrame(center);
      z.oninput = ()=>{ const c = W()/2, s0 = base()*scale; const px = (c-x)/s0, py = (c-y)/s0; scale = +z.value; const s1 = base()*scale; x = c-px*s1; y = c-py*s1; draw(); };
      let drag = null; const pts = new Map(); let pinch = null;
      box.addEventListener("pointerdown", e=>{ box.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pts.size===1) drag = {x:e.clientX-x, y:e.clientY-y}; else { const [a,b] = [...pts.values()]; pinch = { d:Math.hypot(a.x-b.x,a.y-b.y), s:scale }; drag = null; } });
      box.addEventListener("pointermove", e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pinch && pts.size>=2){ const [a,b] = [...pts.values()]; scale = Math.min(4, Math.max(1, pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d)); z.value = scale; z.oninput(); }
        else if(drag){ x = e.clientX-drag.x; y = e.clientY-drag.y; draw(); } });
      const up = e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch = null; if(!pts.size) drag = null; };
      box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
      box.addEventListener("wheel", e=>{ e.preventDefault(); z.value = Math.min(4, Math.max(1, scale - e.deltaY*0.002)); z.oninput(); }, { passive:false });
      sc.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{ URL.revokeObjectURL(url); closeModal(); });
      sc.querySelector("#cropOk").onclick = async ()=>{
        const s = base()*scale, c = document.createElement("canvas"); c.width = c.height = 320;
        const side = W()/s;
        c.getContext("2d").drawImage(img, -x/s, -y/s, side, side, 0, 0, 320, 320);
        URL.revokeObjectURL(url);
        const btn = sc.querySelector("#cropOk"); btn.disabled = true; btn.textContent = "Subiendo…";
        c.toBlob(async b=>{ closeModal(); if(b) await uploadAvatarBlob(b); else toast("No se pudo procesar la imagen."); }, "image/jpeg", 0.88);
      };
    });
  };
  img.src = url;
}

const BADGE_MAP = Object.fromEntries(BADGES.map(b=>[b.id,b]));
function badgeStats(){
  const learned = Object.keys(S.progress||{}).filter(id=>status(id)==="ok").length;
  const mastered = BOOKS.filter(b=>bookMastered(b.name));
  const x = xpInfo();
  let phases = 0; for(let t=0;t<TIERS.length;t++){ const ks = Array.from({length:3},(_,j)=>t*3+j).filter(k=>k<stageCount()); if(ks.length && ks.every(stageDone)) phases = t+1; else break; }
  const duelWins = (COMM.duels||[]).filter(d=>{ const me = d.creator===ME.id; const my = me?d.creator_score:d.opponent_score, th = me?d.opponent_score:d.creator_score, mm = me?d.creator_ms:d.opponent_ms, tm = me?d.opponent_ms:d.creator_ms; return my!=null && th!=null && (my>th || (my===th && mm<tm)); }).length;
  const fr = cloudOn() ? friendsAccepted() : [];
  return {
    learned, streak: Math.max(bestStreak(), streak()), days: Object.values(S.log||{}).filter(L=>L&&L.n).length,
    phases, level: x.lv, xp: x.xp, books: mastered.length,
    div: id => mastered.filter(b=>b.div===id).length, t: t => mastered.filter(b=>b.t===t).length,
    friends: COMM.loaded ? fr.length : (S._friendsSeen||0), duelWins: Math.max(duelWins, S._duelWinsSeen||0), sent: S.sent||0,
    friendStreak: Math.max(0, ...fr.map(f=>streakDays(f)), S._friendStreakSeen||0), perfect: S.perfect||0
  };
}
function badgeValue(b, st){ const [m, arg] = b.metric.split(":"); return arg ? st[m](arg) : st[m]; }

  if(!S || !ME) return;
  const first = !S.badges;
  S.badges = S.badges || {};
  const st = badgeStats();
  // recordar valores de comunidad para no perder logros cuando la lista aún no carga
  if(COMM.loaded){ S._friendsSeen = Math.max(S._friendsSeen||0, st.friends); S._duelWinsSeen = Math.max(S._duelWinsSeen||0, st.duelWins); S._friendStreakSeen = Math.max(S._friendStreakSeen||0, st.friendStreak); }
  const now = new Date().toISOString(), fresh = [];
  BADGES.forEach(b=>{ if(!S.badges[b.id] && badgeValue(b, st) >= b.goal){ S.badges[b.id] = now; fresh.push(b); } });

/* Foto de perfil: se recorta cuadrada y se reduce a 256 px */
function resizeImage(file){
  return new Promise((resolve, reject)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const s = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = 256;
      c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 256, 256);
      URL.revokeObjectURL(url); c.toBlob(b=> b ? resolve(b) : reject(new Error("No se pudo procesar la imagen")), "image/jpeg", 0.85); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("Ese archivo no es una imagen válida")); };
    img.src = url;
  });
}

/* ---------- Voz (lectura en voz alta) ---------- */
function speak(text){
  try{
    if(!("speechSynthesis" in window)){ toast("Tu navegador no puede leer en voz alta."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const vs = speechSynthesis.getVoices();
    const pick = vs.find(v=>/es[-_](CO|MX|US|419)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang));
    if(pick) u.voice = pick;
    u.lang = pick ? pick.lang : "es-ES"; u.rate = .92;
    speechSynthesis.speak(u);
  }catch(e){ toast("No se pudo reproducir el audio."); }
}
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} if(REC){ try{REC.stop();}catch(e){} } }

function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3200);
}

function queueFeedback(item){ const q = LS.get("lampara.fbQueue", []); q.push(Object.assign({ at: Date.now() }, item)); LS.set("lampara.fbQueue", q.slice(-20)); }
async function sendFeedback(item){
  if(!SB || !ME || ME.mode!=="cloud"){ queueFeedback(item); return false; }
  try{ const { error } = await SB.from("feedback").insert(item); if(error) throw error; return true; }
  catch(e){ queueFeedback(item); return false; }
}
async function flushFeedback(){
  if(!SB || !ME || ME.mode!=="cloud") return;
  const q = LS.get("lampara.fbQueue", []); if(!q.length) return;
  const rest = [];
  for(const it of q){ const { at, ...item } = it; try{ const { error } = await SB.from("feedback").insert(item); if(error) throw error; }catch(e){ rest.push(it); } }
  LS.set("lampara.fbQueue", rest);
}
window.addEventListener("online", ()=>flushFeedback());
function modal(html, onMount){
  closeModal();
  const sc = document.createElement("div"); sc.className="scrim"; sc.id="scrim";
  sc.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  sc.addEventListener("click",e=>{ if(e.target===sc) closeModal(); });
  document.body.appendChild(sc);
  if(onMount) onMount(sc);
  const f = sc.querySelector("input,textarea,select,button"); if(f) f.focus();
}

async function hashPass(pass, salt){
  const txt = salt + "|" + pass;
  try{
    if(!(window.crypto && crypto.subtle)) throw 0;
    const buf = await Promise.race([crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)), new Promise((_,r)=>setTimeout(()=>r(0),1500))]);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ let h=2166136261; for(const c of txt){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return "f"+(h>>>0).toString(16); }
}

async function busy(act, label, fn){
  const b = root.querySelector(`[data-act="${act}"]`); const old = b ? b.textContent : "";
  if(b){ if(b.disabled) return; b.disabled = true; b.textContent = label; }
  try{ await fn(); } finally { if(b && document.body.contains(b)){ b.disabled = false; b.textContent = old; } }
}
function onSignup(){ return busy("do-signup","Creando cuenta…", SB ? cloudSignup : localSignup); }
function onLogin(){ return busy("do-login","Entrando…", SB ? cloudLogin : localLogin); }
function authError(e){
  const m = String((e && (e.message||e.error_description)) || e || "");
  if(/invalid login/i.test(m)) return "El correo o la contraseña no coinciden.";
  if(/already registered|already exists/i.test(m)) return "Ya existe una cuenta con ese correo. Toca “Ya tengo una cuenta”.";
  if(/not confirmed/i.test(m)) return "Falta confirmar tu correo: abre el enlace que te enviamos y vuelve a intentar.";
  if(/password/i.test(m) && /(weak|short|least|characters)/i.test(m)) return "La contraseña es muy débil. Usa al menos 6 caracteres.";
  if(/rate|too many/i.test(m)) return "Demasiados intentos seguidos. Espera un minuto e inténtalo de nuevo.";
  if(/fetch|network|failed to fetch|load failed/i.test(m)) return "No hay conexión a internet. Revisa tu conexión e inténtalo de nuevo.";
  return "No se pudo completar: " + m;
}
function localSeed(email){
  if(WEL.migrate) return LS.get("lampara.state.local:"+WEL.migrate, null);
  const acc = accounts().find(a=>a.email===email);
  return acc ? LS.get("lampara.state.acct:"+acc.id, null) : null;
}
async function cloudSignup(){
  const name=$("#suName").value.trim(), email=$("#suEmail").value.trim().toLowerCase(), pass=$("#suPass").value;
  if(!name) return formErr("Escribe tu nombre.");
  if(!validEmail(email)) return formErr("Escribe un correo válido, por ejemplo nombre@correo.com.");
  if(pass.length<6) return formErr("La contraseña debe tener al menos 6 caracteres.");
  if(!$("#suConsent").checked) return formErr("Para crear la cuenta, marca la casilla de autorización de datos.");
  formErr("");
  const { data, error } = await SB.auth.signUp({ email, password: pass, options: { data: { name } } });
  if(error) return formErr(authError(error));
  if(!data.session){ return formErr("Te enviamos un correo para confirmar la cuenta. Ábrelo y luego entra con tu correo y contraseña."); }
  const seed = localSeed(email);
  await cloudEnter(data.user, { name, seed, fresh: !seed });
}
async function cloudLogin(){
  const email=$("#liEmail").value.trim().toLowerCase(), pass=$("#liPass").value;
  if(!validEmail(email)) return formErr("Escribe un correo válido, por ejemplo nombre@correo.com.");
  if(!pass) return formErr("Escribe tu contraseña.");
  formErr("");
  const { data, error } = await SB.auth.signInWithPassword({ email, password: pass });
  if(error){
    let msg = authError(error);
    if(/no coinciden/.test(msg) && accounts().some(a=>a.email===email)) msg += " Si la creaste antes en este dispositivo, toca tu cuenta abajo para pasarla a la nube.";
    return formErr(msg);
  }
  await cloudEnter(data.user, { seed: localSeed(email) });
}
async function cloudForgot(){
  const email = $("#fgEmail").value.trim().toLowerCase();
  if(!validEmail(email)) return formErr("Escribe un correo válido, por ejemplo nombre@correo.com.");
  formErr("");
  const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if(error) return formErr(authError(error));
  WEL.step = "sent"; WEL.sentTo = email; render();
}
async function cloudReset(){
  const a = $("#rsPass").value, b = $("#rsPass2").value;
  if(a.length<6) return formErr("La contraseña debe tener al menos 6 caracteres.");
  if(a!==b) return formErr("Las dos contraseñas no coinciden.");
  formErr("");
  const { data, error } = await SB.auth.updateUser({ password: a });
  if(error) return formErr(/session|expired|jwt/i.test(error.message||"") ? "El enlace ya venció. Pide uno nuevo desde “¿Olvidaste tu contraseña?”." : authError(error));
  RECOVERY = false;
  try{ history.replaceState(null, "", location.pathname); }catch(e){}
  toast("Contraseña actualizada.");
  await cloudEnter(data.user);
}
async function cloudEnter(user, { name, seed, fresh } = {}){
  const meta = user.user_metadata || {};
  let row = null; cloudLoaded = false;
  try{ row = await cloudRead(user.id); cloudLoaded = true; }catch(e){}
  const key = "cloud:"+user.id;
  const cached = LS.get("lampara.state."+key, null);
  let state = row && row.state && Object.keys(row.state).length ? row.state : null;
  if(cached && (!state || (cached._savedAt||0) > (state._savedAt||0))) state = cached;
  const seeded = !state && seed;
  if(seeded) state = seed;
  ME = { mode:"cloud", id:user.id, name:(row&&row.name) || name || meta.name || user.email.split("@")[0], email:user.email, color:colorFor(user.id), key };
  S = Object.assign(freshState(), state || {});
  applyTheme(S.prefs.theme);
  WEL = { step:0, migrate:null, goal:S.prefs.minutes||10, err:"" };
  persist(); cloudFlush(); flushFeedback();
  if(seeded) toast("Tu progreso de este dispositivo ahora está guardado en la nube.");
  COMM.profile = null; COMM.loaded = false; ensureProfile();
  NOTIF.items = []; NOTIF.loaded = false; NOTIF.prefs = null; startNotifs();
  if(fresh && !seeded){ WEL.step="username"; WEL.uname=""; WEL.unTouched=false; WEL.name=ME.name; VIEW={name:"welcome-goal"}; renderWelcomeGoal(); }
  else { enterApp(); if(!PLACE){ handlePendingLink(); handlePendingGo(); } }
}
async function localSignup(){
  const name=$("#suName").value.trim(), email=$("#suEmail").value.trim().toLowerCase(), pass=$("#suPass").value;
  if(!name) return formErr("Escribe tu nombre.");
  if(!validEmail(email)) return formErr("Escribe un correo válido, por ejemplo nombre@correo.com.");
  if(pass.length<6) return formErr("La contraseña debe tener al menos 6 caracteres.");
  const accs = accounts();
  if(accs.some(a=>a.email===email)) return formErr("Ya hay una cuenta con ese correo en este dispositivo. Toca “Ya tengo una cuenta”.");
  const salt = uid()+uid();
  const acc = { id:"a-"+uid()+uid(), name, email, color:COLORS[accs.length%COLORS.length], salt, hash: await hashPass(pass,salt), created:Date.now() };
  if(WEL.migrate){
    acc.legacy = WEL.migrate;
    const old = LS.get("lampara.state.local:"+WEL.migrate, null);
    if(old) LS.set("lampara.state.acct:"+acc.id, old);
  }
  accs.push(acc); saveAccounts(accs);
  signIn(acc, { fresh: !WEL.migrate });
}
async function localLogin(){
  const email=$("#liEmail").value.trim().toLowerCase(), pass=$("#liPass").value;
  if(!validEmail(email)) return formErr("Escribe un correo válido, por ejemplo nombre@correo.com.");
  const acc = accounts().find(a=>a.email===email);
  if(!acc){
    const box = $("#formErr");

    return;
  }
  if(await hashPass(pass, acc.salt)!==acc.hash) return formErr("La contraseña no es correcta. Revisa mayúsculas y espacios.");
  signIn(acc, {});
}
function signIn(acc, {fresh}){

const PRIVACY_TEMPLATE = "<article class=\"policy\">\n  <span class=\"eyebrow\">\u00daltima actualizaci\u00f3n: 9 de octubre de 2026</span>\n  <h1>Pol\u00edtica de privacidad</h1>\n  <p>Esta pol\u00edtica explica qu\u00e9 datos personales recoge <b>Ner</b>, para qu\u00e9 los usa y c\u00f3mo puedes ejercer tus derechos, seg\u00fan la Ley 1581 de 2012 y el Decreto 1377 de 2013 de Colombia.</p>\n\n  <h2>1. Responsable del tratamiento</h2>\n  <p><b>{{RESPONSABLE}}</b>, persona natural responsable del proyecto Ner, en {{CIUDAD}}, Colombia.<br>Correo de contacto: <b>{{CORREO}}</b></p>\n\n  <h2>2. Datos que recogemos</h2>\n  <ul>\n    <li><b>Datos de tu cuenta:</b> nombre y correo electr\u00f3nico. Tu contrase\u00f1a se guarda cifrada; nadie del equipo puede verla.</li>\n    <li><b>Tu progreso:</b> vers\u00edculos que practicas, resultados de tus respuestas, racha, listas, vers\u00edculos que agregas, avance en libros de la Biblia y tus preferencias (duraci\u00f3n de la sesi\u00f3n, tema, tipo de pr\u00e1ctica).</li>\n    <li><b>Comentarios que nos env\u00edas:</b> el mensaje, el tipo de comentario, la parte de la app donde estabas y tu nombre y correo, para poder responderte.</li>\n    <li><b>Recitaci\u00f3n con micr\u00f3fono:</b> cuando usas esta opci\u00f3n, el reconocimiento de voz lo hace el servicio de tu navegador o tel\u00e9fono (por ejemplo, Google en Chrome). Ner recibe solo el texto reconocido para calificar tu respuesta y no guarda grabaciones de tu voz.</li>\n      <li><b>Comunidad (si la usas):</b> tu nombre visible, foto de perfil y @usuario; tus amigos y solicitudes de amistad; los d\u00edas en que practicas, tu racha, tus logros y los resultados de los retos de esgrima; los mensajes, vers\u00edculos y escudos de racha que env\u00edas o recibes.</li>\n    <li><b>Avisos:</b> si activas los avisos en el celular, guardamos el identificador t\u00e9cnico que entrega tu navegador para poder envi\u00e1rtelos, y tus preferencias de avisos y hora del recordatorio.</li>\n</ul>\n  <p>No recogemos tu ubicaci\u00f3n, tus contactos ni datos de pago, y no mostramos publicidad.</p>\n\n  <h2>3. Para qu\u00e9 usamos tus datos</h2>\n  <ul>\n    <li>Crear tu cuenta y permitirte entrar desde cualquier dispositivo.</li>\n    <li>Guardar y sincronizar tu progreso.</li>\n    <li>Mostrar tu perfil, racha y logros solo a tus amigos, a quienes te env\u00edan o reciben una solicitud y a tus rivales de esgrima; tu lista de amigos la ven solo tus amigos. Tu correo nunca se muestra a otras personas.</li>\n    <li>Enviarte los avisos que elijas (solicitudes, retos, rachas, \u00e1nimos y recordatorio diario). Puedes desactivarlos en Perfil.</li>\n    <li>Enviarte correos necesarios para tu cuenta, como el enlace para restablecer tu contrase\u00f1a.</li>\n    <li>Mejorar la app con estad\u00edsticas generales de uso que no te identifican.</li>\n  </ul>\n  <p>No vendemos, alquilamos ni compartimos tus datos con terceros para fines comerciales o publicitarios.</p>\n\n  <h2>4. D\u00f3nde se guardan</h2>\n  <p>Tus datos se guardan en <b>Supabase</b>, el servicio que usamos para las cuentas y la base de datos. Sus servidores pueden estar fuera de Colombia; al aceptar esta pol\u00edtica autorizas esa transferencia, con las medidas de seguridad descritas abajo. La app se publica a trav\u00e9s de <b>GitHub Pages</b>, que no recibe tus datos de cuenta.</p>\n\n  <h2>5. C\u00f3mo protegemos tus datos</h2>\n  <ul>\n    <li>Toda la informaci\u00f3n viaja cifrada (https).</li>\n    <li>Reglas en la base de datos permiten que cada persona modifique solo sus propios datos, y que su perfil y actividad solo los vean sus amigos y contactos de la app.</li>\n    <li>Las contrase\u00f1as se guardan cifradas.</li>\n  </ul>\n\n  <h2>6. Tus derechos</h2>\n  <p>Como titular de tus datos tienes derecho a:</p>\n  <ul>\n    <li>Conocer, actualizar y rectificar tus datos.</li>\n    <li>Solicitar prueba de la autorizaci\u00f3n que nos diste.</li>\n    <li>Ser informado sobre el uso que damos a tus datos.</li>\n    <li>Revocar la autorizaci\u00f3n y pedir que eliminemos tus datos.</li>\n    <li>Presentar quejas ante la Superintendencia de Industria y Comercio (SIC).</li>\n  </ul>\n  <p><b>Eliminar tu cuenta:</b> puedes hacerlo en cualquier momento desde <b>Perfil \u2192 Eliminar cuenta</b>. Se borran tu cuenta y todo tu progreso de forma definitiva.</p>\n  <p><b>Consultas y reclamos:</b> escr\u00edbenos a <b>{{CORREO}}</b>. Respondemos las consultas en m\u00e1ximo 10 d\u00edas h\u00e1biles y los reclamos en m\u00e1ximo 15 d\u00edas h\u00e1biles, como lo indica la ley.</p>\n\n  <h2>7. Menores de edad</h2>\n  <p>La app est\u00e1 pensada para j\u00f3venes y adultos. Si eres menor de 18 a\u00f1os, \u00fasala con autorizaci\u00f3n de tu padre, madre o acudiente.</p>\n\n  <h2>8. Cambios a esta pol\u00edtica</h2>\n  <p>Si cambiamos esta pol\u00edtica, actualizaremos la fecha de arriba y te avisaremos dentro de la app cuando el cambio sea importante.</p>\n</article>\n";

}

  ${badgesSection()}
  ${profileCommunityPanel()}

  <section class="panel">
    <h3 style="margin-bottom:6px">Apariencia</h3>
    <div class="set-group"><div class="set-row"><div class="lbl"><b>Tema</b><small>Sistema sigue el ajuste de tu teléfono</small></div>${seg("theme",[["system","Sistema"],["light","Claro"],["dark","Oscuro"]])}</div>
      <div class="set-row"><div class="lbl"><b>Animación al abrir</b><small>La lámpara se enciende al abrir la app. El sonido suena solo si tu celular lo permite</small></div><div class="row" style="gap:8px;flex-wrap:nowrap"><button class="btn ghost" data-act="intro-preview" style="padding:6px 10px">Ver</button><label class="switch"><input type="checkbox" id="introToggle" ${introEnabled()?"checked":""}><span></span></label></div></div></div>

      <div class="set-row"><div class="lbl"><b>Enviar comentario</b><small>Cuéntanos una idea, un error o algo que te gustaría ver</small></div><button class="btn" data-act="feedback">${I.chat} Escribir</button></div>
      <div class="set-row"><div class="lbl"><b>Cerrar sesión</b><small>Tu progreso queda guardado en esta cuenta</small></div><button class="btn" data-act="logout">${I.logout} Cerrar sesión</button></div>

  </section>
  <section class="panel" style="display:flex;flex-direction:column;gap:10px"><h3>Acerca de</h3>${PRIV_READY?`<button class="linkbtn" data-act="privacy" style="align-self:flex-start;padding:0">Política de privacidad</button>`:""}${noticeHTML()}</section>`;

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-list],[data-act],[data-login],[data-mode],[data-grade]");
  if(!t) return;
  if(t.closest(".modal") && !t.dataset.act) return;

  if(t.dataset.mode){ SESSION.mode = t.dataset.mode; S.prefs.mode = t.dataset.mode; persist(); render(); return; }
  if(t.dataset.grade){ gradeText(parseFloat(t.dataset.grade)); return; }
  if(t.dataset.act==="self-grade"){ const q = SESSION && SESSION.q; if(!q || q.done) return; q.textDone = false; delete SESSION.pending[q.id];
    $("#feedback").innerHTML = `<div style="display:flex;flex-direction:column;gap:10px"><p style="font-weight:600">¿Qué tan bien lo recitaste?</p>
      <div class="grade"><button data-grade="0.2">No lo recordé<small>Volver a practicar</small></button><button data-grade="0.7">Con errores<small>Varias palabras mal</small></button><button data-grade="0.9">Bien<small>Detalles menores</small></button><button data-grade="1">Perfecto<small>Palabra por palabra</small></button></div></div>`; return; }
  if(t.dataset.go){ if(t.dataset.go==="avisos") openAvisos(); else go(t.dataset.go); return; }
  const a = t.dataset.act;
  if(!a && t.dataset.list){ go(t.dataset.list==="rev"?"review":"list",{list:t.dataset.list}); return; }
  const id = t.dataset.id;
  switch(a){
    case "logout": signOut(); break;
    case "feedback": feedbackModal(); break;
    case "open-topic": go("topic", { topic: t.dataset.id }); break;
    case "play-topic": { const tp=TOPIC_MAP[t.dataset.id]; S.extraActive=[...new Set((S.extraActive||[]).concat(tp.ids.filter(x=>!activeIds().includes(x))))]; persist(); startSession(pickFor("topic:"+tp.id),{title:tp.name, source:"topic:"+tp.id}); break; }
    case "save-topic": { const tp=TOPIC_MAP[t.dataset.id]; let l=S.lists.find(x=>x.topic===tp.id); if(!l){ l={ id:"l-"+uid(), name:tp.name, ids:tp.ids.slice(), topic:tp.id }; S.lists.push(l); persist(); toast(`“${tp.name}” se guardó en tus listas.`); } else toast("Ya tienes este tema en tus listas."); go("list",{list:l.id}); break; }
    case "copy-link": { const link=t.dataset.link; (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast("Enlace copiado.")).catch(()=>{ toast("Copia este enlace: "+link); }); break; }
    case "friend-search": searchFriend(); break;
    case "push-on": enablePush(t); break;
    case "path-play": startPath(); break;
    case "path-stage": { const k=+t.dataset.k; if(k===currentStage()) startPath(); else { const ids=stageIds(k); startSession(shuffle(ids),{title:`Repaso · Etapa ${k+1}`, source:ids.slice()}); } break; }
    case "path-locked": toast("Termina la etapa actual para desbloquear esta."); break;
    case "cal-prev": VIEW.month=(VIEW.month||0)-1; render(); break;
    case "cal-next": VIEW.month=Math.min(0,(VIEW.month||0)+1); render(); break;
    case "verse-open": verseModal(t.dataset.id); break;
    case "heart-open": openHeart(); break;
    case "shield-pick": shieldPickModal(); break;
    case "shield-send": sendShield(t.dataset.id, t); break;
    case "shield-send-ask": { const uid = t.dataset.id; confirmBox("Regalar un escudo", `Le darás uno de tus escudos a ${personLabel(uid).split(" ")[0]}. Te quedarán ${(S.shields||1)-1}.`, "Regalar", ()=>sendShield(uid)); break; }
    case "heart-close": closeHeart(); break;
    case "heart-practice": { const hid = t.dataset.id, v = verse(hid); closeHeart(); if(v) startSession([hid], { title:v.ref }); break; }
    case "heart-fav": { const hid = t.dataset.id; if(S.favs.includes(hid)) S.favs = S.favs.filter(x=>x!==hid); else S.favs.unshift(hid); persist(); t.innerHTML = heartFavBtn(hid); toast(S.favs.includes(hid) ? "Guardado en Mis versículos." : "Lo quitaste de Mis versículos."); break; }
    case "heart-share": shareHeart(t); break;
    case "intro-preview": { try{ sessionStorage.removeItem("lampara.introSeen"); }catch(e){} const was = introEnabled(); try{ localStorage.removeItem("lampara.intro"); }catch(e){} replayIntro(); if(!was){ try{ localStorage.setItem("lampara.intro","off"); }catch(e){} } break; }
    case "badge-open": badgeModal(t.dataset.id, !!t.dataset.friend); break;
    case "practice-hard": { const ids=hardestIds(activeIds()); startSession(shuffle(ids),{title:"Los que más te cuestan", source:ids.slice()}); break; }
    case "push-off": disablePush(); break;
    case "notif-clear": confirmBox("¿Borrar todos los avisos?", "Se borran de la lista. No afecta a tus amigos ni a tus retos.", "Borrar", ()=>NAPI.clear().then(()=>{ NOTIF.items=[]; render(); }).catch(e=>toast(notifError(e)))); break;
    case "notif-settings": go("profile"); setTimeout(()=>{ const el=$("#avisos-ajustes"); if(el) el.scrollIntoView({behavior:"smooth"}); }, 50); break;
    case "streak-invite": streakAction("invite", t.dataset.id, t); break;
    case "streak-accept": streakAction("accept", t.dataset.id, t); break;
    case "streak-reject": streakAction("reject", t.dataset.id, t); break;
    case "streak-end": confirmBox("¿Terminar la racha juntos?", "La racha vuelve a cero. Siguen siendo amigos y pueden empezar otra cuando quieran.", "Terminar", ()=>streakAction("end", t.dataset.id)); break;
    case "cheer-open": cheerModal(t.dataset.id); break;
    case "verse-save": { const id=t.dataset.id; if(!S.favs.includes(id)){ S.favs.unshift(id); persist(); } toast(`${SUG_MAP[id].ref} quedó en Mis versículos.`); render(); break; }
    case "verse-practice": { const id=t.dataset.id; startSession([id],{ title:SUG_MAP[id].ref, source:[id] }); break; }
    case "friend-add": friendAction("add", t.dataset.id, t); break;
    case "friend-accept": friendAction("accept", t.dataset.id, t); break;
    case "friend-reject": friendAction("reject", t.dataset.id, t); break;
    case "friend-cancel": friendAction("cancel", t.dataset.id, t); break;
    case "friend-remove": confirmBox("¿Eliminar a este amigo?", "Dejarán de ver su racha y actividad. Cada uno conserva su propio progreso.", "Eliminar", ()=>friendAction("remove", t.dataset.id)); break;
    case "friend-open": closeModal(); go("friend", { uid: t.dataset.id }); break;
    case "amigos-open": COMM.search = null; COMM.searchQ = ""; if(COMM.flists && t.dataset.id!==ME.id) delete COMM.flists[t.dataset.id]; go("amigos", { uid: t.dataset.id }); break;
    case "duel-pick": duelPickModal(); break;
    case "duels-more": COMM.allDuels = !COMM.allDuels; render(); break;
    case "fbadges-all": friendBadgesModal(t.dataset.id); break;
    case "duel-friend": { t.disabled=true; if(t.closest(".modal")) closeModal(); API.createDuel(makeDuelQuestions(), t.dataset.id).then(d=>{ COMM.loaded=false; startDuelPlay(d); }).catch(e=>{ t.disabled=false; toast(commError(e)); }); break; }
    case "save-username": { const v=($("#username").value||"").trim().replace(/^@/,"").toLowerCase(); if(!/^[a-z0-9_.]{3,20}$/.test(v)){ toast(commError("usuario_invalido")); break; } API.setUsername(v).then(u=>{ COMM.profile=Object.assign({},COMM.profile,{username:u}); render(); toast("Usuario actualizado: @"+u); }).catch(e=>toast(commError(e))); break; }
    case "duel-new": { t.disabled=true; API.createDuel(makeDuelQuestions()).then(d=>{ COMM.loaded=false; startDuelPlay(d); }).catch(e=>{ t.disabled=false; toast(commError(e)); }); break; }
    case "duel-join": { const c=($("#duelCode").value||"").trim().toUpperCase(); if(c.length<4){ toast("Escribe el código del reto."); break; } PENDING_LINK={type:"duel",code:c}; handlePendingLink(); break; }
    case "duel-play": { const d=COMM.duels.find(x=>x.id===t.dataset.id); if(d) startDuelPlay(d); break; }
    case "duel-share": case "duel-view": { const d=COMM.duels.find(x=>x.id===t.dataset.id); if(d){ BQ={ kind:"duel", duel:d, qs:d.questions, i:d.questions.length, done:true, score:0 }; VIEW={name:"bquiz"}; render(); } break; }
    case "avatar-remove": API.removeAvatar().then(()=>{ COMM.profile=Object.assign({},COMM.profile,{avatar_url:null}); return API.saveProfile(COMM.profile); }).then(()=>{ render(); toast("Foto eliminada."); }).catch(e=>toast(commError(e))); break;
    case "save-display": { const v=($("#displayName").value||"").trim(); if(!v){ toast("Escribe un nombre."); break; } COMM.profile=Object.assign({ avatar_url:null }, COMM.profile, { display_name:v }); API.saveProfile(COMM.profile).then(()=>{ render(); toast("Nombre visible actualizado."); }).catch(e=>toast(commError(e))); break; }
    case "do-signup": onSignup().catch(()=>formErr("No se pudo crear la cuenta. Inténtalo de nuevo.")); break;
    case "do-forgot": busy("do-forgot","Enviando…", cloudForgot).catch(()=>formErr("No se pudo enviar el enlace. Inténtalo de nuevo.")); break;
    case "do-reset": busy("do-reset","Guardando…", cloudReset).catch(()=>formErr("No se pudo guardar la contraseña. Inténtalo de nuevo.")); break;
    case "wel-forgot": { const em=$("#liEmail"); WEL.prefillEmail = (em&&em.value.trim()) || WEL.sentTo || null; WEL.step="forgot"; WEL.err=""; render(); break; }
    case "wel-privacy": WEL.prevStep = WEL.step; WEL.step="privacy"; render(); window.scrollTo({top:0}); break;
    case "wel-back-from-privacy": WEL.step = WEL.prevStep || 0; render(); break;
    case "privacy": go("privacy"); break;
    case "do-login": onLogin().catch(()=>formErr("No se pudo iniciar sesión. Inténtalo de nuevo.")); break;
    case "delete-account": confirmBox("¿Eliminar tu cuenta?", `Se borrarán la cuenta de ${ME.email} y todo su progreso, racha y listas${ME.mode==="cloud"?", también en la nube":""}. No se puede deshacer.`, "Eliminar definitivamente", deleteAccount); break;
    case "pref": { const k=t.dataset.k; let v=t.dataset.v; if(k==="minutes"){ v=+v; S.prefs.size=versesFor(v); }
      if(k==="ritmo"){ S.prefs.minutes = RITMOS[v].min; S.prefs.size = versesFor(RITMOS[v].min); toast(`Ritmo ${RITMOS[v].label.toLowerCase()}: ${RITMOS[v].min} minutos al día.`); } S.prefs[k]=v; if(k==="theme") applyTheme(v); persist(); render(); break; }
    case "wel-next": WEL.step++; render(); break;
    case "wel-skip": WEL.step=SLIDES.length-1; render(); break;
    case "wel-signup": WEL.step="signup"; WEL.migrate=null; WEL.seedFrom=null; WEL.err=""; render(); break;
    case "wel-login": WEL.step="login"; WEL.err=""; render(); break;
    case "wel-back": WEL.step = WEL.step==="signup"||WEL.step==="login" ? SLIDES.length-1 : 0; render(); break;
    case "toggle-pw": { const inp=$("#"+t.dataset.for); const show=inp.type==="password"; inp.type=show?"text":"password"; t.textContent=show?"Ocultar":"Mostrar"; break; }
    case "pick-acc": WEL.prefill=t.dataset.email; render(); break;
    case "signup-with": WEL.step="signup"; WEL.migrate=null; WEL.err=""; WEL.prefillEmail=t.dataset.email; render(); break;
    case "migrate-acc": { const acc=accounts().find(a=>a.id===t.dataset.id); if(acc){ WEL.step="signup"; WEL.migrate=null; WEL.err=""; WEL.seedFrom=acc.id; WEL.prefillEmail=acc.email; WEL.prefillName=acc.name; render(); } break; }
    case "migrate": WEL.step="signup"; WEL.migrate=t.dataset.name; WEL.err=""; render(); break;
    case "wel-username": saveWelcomeUsername(false); break;
    case "wel-username-skip": saveWelcomeUsername(true); break;
    case "wel-ritmo": WEL.ritmo=t.dataset.k; WEL.goal=RITMOS[t.dataset.k].min; root.querySelectorAll('[data-act="wel-ritmo"]').forEach(b=>b.setAttribute("aria-pressed", b===t)); break;
    case "wel-goal": WEL.goal=+t.dataset.m; root.querySelectorAll(".goal").forEach(b=>b.setAttribute("aria-pressed", b===t)); break;
    case "wel-finish": case "wel-finish-skip": {
      S.prefs.ritmo = WEL.ritmo || "constante"; S.prefs.minutes = RITMOS[S.prefs.ritmo].min; S.prefs.size = versesFor(S.prefs.minutes); persist();
      if(a==="wel-finish") startPlacement(); else { S.placed={ level:"Principiante", score:null, date:todayKey(), skipped:true }; persist(); go("home"); handlePendingLink(); }
      break;
    }
    case "new-list": newListModal(); break;
    case "add-verse": addVerseModal(); break;
    case "add-to-this": addToListModal(t.dataset.list); break;
    case "to-list": toListModal(id); break;
    case "speak": { const v=verse(id); if(v) speak(v.ref+". "+v.text); break; }
    case "fav": {
      e.stopPropagation();
      const v = verse(id);
      if(S.favs.includes(id)){ S.favs = S.favs.filter(x=>x!==id); toast(`${v.ref} volvió a Sugeridos.`); }
      else { S.favs.unshift(id); toast(`${v.ref} se movió a Mis versículos.`); }
      persist();
      if(VIEW.name==="session"){ const btn=t; const fav=S.favs.includes(id); btn.innerHTML=`${fav?I.heartF:I.heart} ${fav?"En Mis versículos":"Agregar a Mis versículos"}`; btn.style.color=fav?"var(--accent)":""; btn.classList.toggle("ghost",!fav); }
      else render();
      break;
    }
    case "rm-from-list": { const l=S.lists.find(x=>x.id===t.dataset.list); if(l){ l.ids=l.ids.filter(x=>x!==id); persist(); render(); } break; }
    case "del-verse": {
      const v=verse(id);
      confirmBox("¿Eliminar este versículo?", `${v.ref} y su progreso se borrarán de tu cuenta.`, "Eliminar", ()=>{
        S.custom=S.custom.filter(x=>x.id!==id); S.favs=S.favs.filter(x=>x!==id); delete S.progress[id]; S.lists.forEach(l=>l.ids=l.ids.filter(x=>x!==id)); persist(); render(); toast("Versículo eliminado.");
      }); break;
    }
    case "del-list": {
      const l=S.lists.find(x=>x.id===t.dataset.list);
      confirmBox("¿Eliminar esta lista?", `Se borrará “${l.name}”. Los versículos y tu progreso se conservan.`, "Eliminar lista", ()=>{ S.lists=S.lists.filter(x=>x.id!==l.id); persist(); go("library"); });
      break;
    }
    case "unlock-more": { const add=SUGGESTED.map(r=>r[0]).filter(id=>SUG_MAP[id].order>=S.unlocked && !(S.extraActive||[]).includes(id)).slice(0,3); S.extraActive=(S.extraActive||[]).concat(add); persist(); render(); toast(`${add.length} versículos agregados a tu plan.`); break; }
    case "unlock-now": { S.extraActive=(S.extraActive||[]).concat(id); persist(); render(); toast("Versículo agregado a tu plan."); break; }
    case "catch-up": { const due = dueIds(activeIds()).filter(id=>prog(id)&&prog(id).reps>0).sort((a,b)=>prog(a).due-prog(b).due).slice(0,15); startSession(due, { title:"Ponerme al día", source:due }); break; }
    case "start-due": case "start-extra": { startSession(pickFor("active"),{title:a==="start-due"?"Práctica de hoy":"Práctica extra", source:"active"}); break; }
    case "play-list": {
      const l=getList(t.dataset.list); const q=pickFor(l.id, l.id);
      startSession(q,{title:l.name, listId:l.id, source:l.id}); break;
    }
    case "start-review": {
      startSession(pickFor("rev"),{title:"Repaso de memorizados", review:true, source:"rev"}); break;
    }
    case "quit": stopSpeech(); SESSION=null; go("home"); break;
    case "bq-start": startBooks("books", t.dataset.scope); break;
    case "bq-trivia": startBooks("trivia"); break;
    case "bq-opt": { const q=BQ.qs[BQ.i]; if(BQ.answered) break; q.chosen=q.opts[+t.dataset.k]; answerBook(q.chosen===q.answer); break; }
    case "bq-pick": { const q=BQ.qs[BQ.i]; if(BQ.answered) break; const nm=q.opts[+t.dataset.k]; if(!q.picked.includes(nm)) q.picked.push(nm); if(q.picked.length===q.answer.length) answerBook(q.picked.join("|")===q.answer.join("|")); else render(); break; }
    case "bq-undo": { const q=BQ.qs[BQ.i]; q.picked.pop(); render(); break; }
    case "bq-next": BQ.i++; BQ.answered=false; if(BQ.kind==="duel" && BQ.i>=BQ.qs.length){ finishDuel(); break; } render(); window.scrollTo({top:0}); break;
    case "bq-again": startBooks(BQ.kind, BQ.scope); break;
    case "bq-exit": { const k=BQ&&BQ.kind; BQ=null; if(k==="duel"){ COMM.loaded=false; go("community"); } else go("books"); break; }
    case "pl-start": PLACE.phase="q"; PLACE.i=0; PLACE.answered=false; render(); break;
    case "pl-skip": S.placed={ level:"Principiante", score:null, date:todayKey(), skipped:true }; persist(); PLACE=null; go("home"); handlePendingLink(); break;
    case "pl-check": placementCheck(); break;
    case "pl-unknown": { const it=PLACE.items[PLACE.i]; placementAnswer(0, `<p class="muted" style="font-size:13px">${esc(verse(it.id).ref)}</p><p class="verse-text" style="font-size:19px">${esc(verse(it.id).text)}</p>`); break; }
    case "pl-opt": {
      const it=PLACE.items[PLACE.i]; if(PLACE.answered) break;
      const pick=it.opts[+t.dataset.k], right=pick===verse(it.id).ref;
      root.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; const o=it.opts[+b.dataset.k]; if(o===verse(it.id).ref) b.classList.add("right"); else if(b===t) b.classList.add("wrong"); });
      placementAnswer(right?1:0, `<div class="result-bar ${right?"ok":"bad"}" style="padding:10px 16px"><span>${right?"¡Correcto!":"La cita correcta es "+esc(verse(it.id).ref)}</span></div>`);
      break;
    }
    case "pl-next": if(PLACE.i<PLACE.items.length-1){ PLACE.i++; PLACE.answered=false; render(); window.scrollTo({top:0}); } else finishPlacement(); break;
    case "pl-finish": PLACE=null; go("home"); handlePendingLink(); break;
    case "begin-cards": rememberSession(SESSION.ids); SESSION.started=Date.now(); SESSION.cardIds=cardIdsFor(SESSION.ids); SESSION.phase="cards"; SESSION.i=0; SESSION.flipped=false; render(); break;
    case "dur": { const m=+t.dataset.m; S.prefs.minutes=m; S.prefs.size=versesFor(m); const ids=pickFor(SESSION.source, SESSION.listId); if(ids.length) SESSION.ids=ids; if(GROWN){ toast(`Agregamos ${GROWN} versículos nuevos para completar el tiempo.`); GROWN=0; } persist(); render(); break; }
    case "skip-cards": rememberSession(SESSION.ids); SESSION.started=Date.now(); startQuiz(); render(); break;
    case "flip": SESSION.flipped=!SESSION.flipped; $(".flash").classList.toggle("flipped",SESSION.flipped); break;
    case "card-prev": SESSION.i--; SESSION.flipped=false; stopSpeech(); render(); break;
    case "card-next":
      stopSpeech();
      if(SESSION.i<SESSION.cardIds.length-1){ SESSION.i++; SESSION.flipped=false; }
      else { startQuiz(); }
      render(); break;
    case "check": checkAnswer(); break;
    case "giveup": gradeText(0); break;
        case "check-ref": checkRef(); break;
    case "giveup-ref": checkRef(true); break;
    case "hint": {
      const q=SESSION.q, v=verse(q.id);
      if(q.mode==="blanks"){ const el=[...root.querySelectorAll("[data-blank]")].find(x=>!x.value.trim()); if(el){ const i=+el.dataset.blank; el.value=norm(q.toks[i]).charAt(0); el.focus(); } }
      else if(q.mode==="write"){ const w=$("#writeBox"); const tw=v.text.split(/\s+/); const have=words(w.value).length; w.value=tw.slice(0,Math.min(tw.length,have+2)).join(" ")+" "; w.focus(); toast("Te mostramos las siguientes palabras."); }
      else { $("#micMsg").textContent = "Empieza así: “"+v.text.split(/\s+/).slice(0,3).join(" ")+"…”"; }
      break;
    }
    case "mic": startMic(); break;
    case "reveal": reveal(); break;
    case "next-q":
      stopSpeech();
      if(SESSION.t<SESSION.tasks.length-1){ SESSION.t++; prepQuestion(); render(); }
      else { SESSION.unlocked = SESSION.review ? 0 : maybeUnlock(); SESSION.advanced = checkStageAdvance(SESSION.stageBefore); if(SESSION.results.length>=3 && SESSION.results.every(x=>x.score>=0.999)) S.perfect = (S.perfect||0)+1; rememberSession(SESSION.ids, SESSION.results.filter(x=>x.outcome==="bad").map(x=>x.id)); persist(); SESSION.phase="done"; render(); }
      break;
    case "end-home": SESSION=null; go("home"); break;
    case "again": {
      const s=SESSION;
      if(s.source==="path"){ startPath(); break; }
      startSession(Array.isArray(s.source) ? s.source.slice() : pickFor(s.source, s.listId),{title:s.title, review:s.review, listId:s.listId, source:s.source});
      break;
    }
  }
});
document.addEventListener("change", e=>{ if(e.target && e.target.id==="introToggle"){ try{ localStorage.setItem("lampara.intro", e.target.checked ? "on" : "off"); }catch(err){} toast(e.target.checked ? "La lámpara se encenderá al abrir la app." : "Animación desactivada."); return; } if(e.target && e.target.id==="avatarInput") onAvatarPicked(e.target); if(e.target && e.target.dataset && e.target.dataset.pref){ const k=e.target.dataset.pref; savePref(k, k==="hora" ? Number(e.target.value) : e.target.checked); } });
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target && e.target.tagName==="INPUT"){ const f=e.target.closest("[data-enter]"); if(f){ e.preventDefault(); const b=f.querySelector(`[data-act="${f.dataset.enter}"]`); if(b) b.click(); return; } }
  if((e.key==="Enter"||e.key===" ") && document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("side-foot")){ e.preventDefault(); go("profile"); return; }
  if(!SESSION || VIEW.name!=="session") return;
  if(SESSION.phase==="cards" && (e.key===" "||e.key==="Enter") && document.activeElement.classList.contains("flash")){ e.preventDefault(); SESSION.flipped=!SESSION.flipped; $(".flash").classList.toggle("flipped",SESSION.flipped); }
  if(SESSION.phase==="quiz" && SESSION.q && SESSION.q.mode==="write" && e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); checkAnswer(); }
});

/* =========================================================
   ANIMACIÓN DE APERTURA: la lámpara se enciende y la luz llena la pantalla
   (una vez por apertura de la app; se puede desactivar en Perfil)
   ========================================================= */
function introEnabled(){ try{ return localStorage.getItem("lampara.intro") !== "off"; }catch(e){ return true; } }
function introSound(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ctx = new AC();
    const go = ()=>{
      const t = ctx.currentTime, out = ctx.createGain(); out.gain.value = .22; out.connect(ctx.destination);
      // "fuu": soplo suave al encenderse la llama
      const len = ctx.sampleRate * .5, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
      const n = ctx.createBufferSource(); n.buffer = buf; const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.setValueAtTime(400, t+1); f.frequency.exponentialRampToValueAtTime(1600, t+1.45); f.Q.value = .8;
      const ng = ctx.createGain(); ng.gain.setValueAtTime(0, t+1); ng.gain.linearRampToValueAtTime(.5, t+1.1); ng.gain.exponentialRampToValueAtTime(.001, t+1.55);
      n.connect(f); f.connect(ng); ng.connect(out); n.start(t+1); n.stop(t+1.6);
      // campanita cálida al llenarse de luz
      [[659.25,1.55],[987.77,1.67],[1318.5,1.8]].forEach(([hz,at])=>{ const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = hz;
        g.gain.setValueAtTime(0, t+at); g.gain.linearRampToValueAtTime(.35, t+at+.02); g.gain.exponentialRampToValueAtTime(.001, t+at+1.4); o.connect(g); g.connect(out); o.start(t+at); o.stop(t+at+1.5); });
      setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 4500);
    };
    if(ctx.state === "running") go();
    else ctx.resume().then(()=>{ if(ctx.state === "running") go(); }).catch(()=>{});   // si el navegador no deja sonar sin un toque, se omite
  }catch(e){}
}
function replayIntro(){ playIntro(true); }
function playIntro(force){
  let seen = false; try{ seen = sessionStorage.getItem("lampara.introSeen") === "1"; sessionStorage.setItem("lampara.introSeen","1"); }catch(e){}
  if(!force && (seen || !introEnabled())) return;
  const old = $("#intro"); if(old) old.remove();
  const el = document.createElement("div"); el.id = "intro"; el.setAttribute("aria-hidden","true");
  el.innerHTML = `<div class="glow"></div><div class="lampx"><svg viewBox="0 0 24 24"><path class="base b2" d="M4 14h16l-2 3H6z"/><path class="base b1" d="M8 18h8l-1 3H9z"/><path class="flame" d="M12 3c1.2 2 3 3.2 3 5.2A3 3 0 0 1 12 11a3 3 0 0 1-3-2.8C9 6.2 10.8 5 12 3z"/><path class="core" d="M12 6.4c.6 1 1.4 1.6 1.4 2.6a1.4 1.4 0 0 1-2.8 0c0-1 .8-1.6 1.4-2.6z"/></svg></div><div class="word">Ner</div><div class="word sub">«lámpara» en hebreo · <bdi lang="he">נֵר</bdi></div><div class="fill"></div>`;
  document.body.appendChild(el);
  introSound();
  let done = false;
  const finish = ()=>{ if(done) return; done = true; el.classList.add("out"); setTimeout(()=>el.remove(), 460); };
  el.addEventListener("click", finish);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(finish, reduce ? 500 : 2750);
}
playIntro();

/* =========================================================
   ARRANQUE
   ========================================================= */
function renderSplash(){ root.innerHTML = `<div class="wel"><div class="empty" style="margin:auto"><div class="brand-mark" style="width:48px;height:48px">${I.lamp}</div><b>Ner</b><span>Cargando tu progreso…</span></div></div>`; }
(async function boot(){
  if(SB){
    renderSplash();
    let user = null;
    try{ const { data } = await SB.auth.getSession(); user = data && data.session && data.session.user; }catch(e){}
    if(RECOVERY && user){ WEL.step = "reset"; render(); return; }
    if(LINK_ERROR){ WEL.step = "forgot"; WEL.err = "El enlace ya venció o ya se usó. Pide uno nuevo."; try{ history.replaceState(null, "", location.pathname); }catch(e){} render(); return; }
    if(user){ await cloudEnter(user); return; }
    if(accounts().length || localProfiles().length) WEL.step = "login";
    render(); return;
  }
  const sid = LS.get("lampara.session", null);
  const acc = sid && accounts().find(a=>a.id===sid);
  if(acc){ ME = { mode:"account", id:acc.id, name:acc.name, email:acc.email, color:acc.color, key:"acct:"+acc.id }; S = Object.assign(freshState(), LS.get("lampara.state."+ME.key, {})); applyTheme(S.prefs.theme); }
  if(!acc && (accounts().length || localProfiles().length)) WEL.step = "login";
  if(acc) enterApp(); else render();
})();
if("speechSynthesis" in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){} }
</script>
