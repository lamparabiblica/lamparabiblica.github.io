<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v2.png">
<title>Ner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
[hidden]{display:none!important}
html,body{margin:0}img{max-width:100%}
/* Layout: app shell tipo reproductor — barra lateral de navegación (abajo en móvil), escenario central con la tarjeta del versículo como protagonista */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EEF2F8; --line:#E2E8F2;
  --ink:#111827; --muted:#5B6478; --accent:#2F6FED; --accent-ink:#FFFFFF; --accent-soft:#E4EDFF; --accent-dark:#1F55C4;
  --glow:rgba(47,111,237,.20);
  --gold:#FFB020; --gold-ink:#4A3000; --gold-soft:#FFF2D6; --gold-text:#B26F00; --gold-dark:#DB8E00;
  --ok:#16A36A; --ok-soft:#DDF6EA; --mid:#7C5CFF; --mid-soft:#ECE7FF; --bad:#E5484D; --bad-soft:#FFE6E6; --none:#A3ACBD;
  --card-border:transparent; --hero-1:#2F6FED; --hero-2:#1D4FC4;
  --shadow:0 1px 2px rgba(17,24,39,.05), 0 6px 20px rgba(17,24,39,.06);
  --f-display:"Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --f-verse:var(--f-display);
  --f-mono:var(--f-display);
  --r:14px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#131C2E; --surface-2:#1B263C; --line:#25324B;
  --ink:#EEF2FA; --muted:#94A0B8; --accent:#5B8DEF; --accent-ink:#FFFFFF; --accent-soft:#1C2C4F; --accent-dark:#2F5FC2;
  --glow:rgba(91,141,239,.25);
  --gold:#FFC043; --gold-ink:#3A2600; --gold-soft:#3A2E12; --gold-text:#FFC043; --gold-dark:#C98F12;
  --ok:#3DD68C; --ok-soft:#12352A; --mid:#A08BFF; --mid-soft:#262055; --bad:#FF6B6E; --bad-soft:#3D1A1F; --none:#5E6A82;
  --card-border:#25324B; --hero-1:#2B5CD6; --hero-2:#1B3A8F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#131C2E; --surface-2:#1B263C; --line:#25324B;
  --ink:#EEF2FA; --muted:#94A0B8; --accent:#5B8DEF; --accent-ink:#FFFFFF; --accent-soft:#1C2C4F; --accent-dark:#2F5FC2;
  --glow:rgba(91,141,239,.25);
  --gold:#FFC043; --gold-ink:#3A2600; --gold-soft:#3A2E12; --gold-text:#FFC043; --gold-dark:#C98F12;
  --ok:#3DD68C; --ok-soft:#12352A; --mid:#A08BFF; --mid-soft:#262055; --bad:#FF6B6E; --bad-soft:#3D1A1F; --none:#5E6A82;
  --card-border:#25324B; --hero-1:#2B5CD6; --hero-2:#1B3A8F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.12;text-wrap:balance;font-weight:800;letter-spacing:-.025em}
h1 em,h2 em,h3 em{font-family:inherit;font-style:normal;font-weight:inherit;color:var(--gold-text)}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--gold),#FF8A00);display:grid;place-items:center;color:#fff;box-shadow:0 3px 0 var(--gold-dark)}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"] svg{color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.side-lists{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.side-lists button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:14px}
.side-lists button:hover{background:var(--surface-2)}
.side-lists button:focus-visible{outline:2px solid var(--accent)}
.side-lists .cover{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
.side-lists span.n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:14px}
.side-foot .who{min-width:0;flex:1}
.side-foot .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who small{font-size:11px;color:var(--muted)}
.icon-btn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}

main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:28px 120px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

.tabbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding-block:18px 110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:10px}
  .tabbar button[aria-current="true"]{color:var(--accent)}
  .tabbar button[aria-current="true"] svg{transform:scale(1.08)}
  .mtop{display:flex!important}
}
.mtop{display:none;align-items:center;justify-content:space-between;gap:12px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 2px 0 var(--line);transition:transform .08s ease, background .15s, box-shadow .08s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-dark)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-dark)}
.btn.gold:hover{filter:brightness(1.05);background:var(--gold)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.lg{padding:13px 22px;font-size:15.5px;border-radius:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.play{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--accent-dark);transition:transform .12s}
.play:hover{transform:scale(1.05)}
.play.sm{width:40px;height:40px}

/* ---------- Cards / panels ---------- */
.panel{background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.gold{background:var(--gold-soft);color:var(--gold-text)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.mid{background:var(--mid-soft);color:var(--mid)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.none{background:var(--surface-2);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- Dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.today{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--hero-1),var(--hero-2));color:#fff;border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:16px;min-height:250px;box-shadow:0 10px 30px rgba(47,111,237,.25)}
.today::after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--gold) 0%,transparent 62%);opacity:.38;pointer-events:none}
.today .eyebrow{color:rgba(255,255,255,.75)}
.greet{font-size:17px;font-weight:600;color:rgba(255,255,255,.9);position:relative;z-index:1}
.today h1{font-size:clamp(28px,4vw,40px);position:relative;z-index:1;color:#fff}
.today h1 em{color:var(--gold)}
.today .verse-peek{font-size:17px;font-weight:500;line-height:1.45;max-width:46ch;color:rgba(255,255,255,.92);position:relative;z-index:1}
.today .row{position:relative;z-index:1;margin-top:auto}
.today .btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-dark)}
.today .btn:not(.primary){background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.28);box-shadow:none}
.today .btn:not(.primary):hover{background:rgba(255,255,255,.2)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0}
button.stat{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0;position:relative;transition:transform .12s}
button.stat:hover{transform:translateY(-2px)}
button.stat:focus-visible{outline:2px solid var(--accent)}
button.stat .go{position:absolute;top:16px;right:16px;color:var(--muted);font-size:18px;line-height:1}
.stat .big{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat .big small{font-size:18px;font-weight:600;color:var(--muted);margin-left:2px}
.ring-wrap{display:flex;align-items:center;gap:16px}
.flame{color:var(--gold)}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.stackbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.stackbar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.legend div{display:flex;flex-direction:column;gap:2px}
.legend b{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.legend span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-weight:600}

.vlist{display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 12px;border-radius:12px}
.vrow:hover{background:var(--surface-2)}
.vrow .idx{font-size:12px;font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.vrow .t{min-width:0}
.vrow .t b{font-weight:700;font-size:15px}
.vrow .t p{font-size:14.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .t.open{cursor:pointer}
.vrow .t.open:hover b{color:var(--accent)}
.vrow .acts{display:flex;gap:2px}
.vrow.locked{opacity:.55}
@media (max-width:560px){.vrow{grid-template-columns:minmax(0,1fr) auto;gap:8px}.vrow .idx{display:none}.vrow .chip{grid-column:1;justify-self:start}.vrow .acts{grid-row:1/span 2;grid-column:2}}

/* ---------- Library ---------- */
.lib-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:end}
.cover-xl{width:160px;height:160px;border-radius:18px;display:grid;place-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cover-xl .glyph{font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1}
@media (max-width:620px){.lib-head{grid-template-columns:1fr}.cover-xl{width:110px;height:110px}.cover-xl .glyph{font-size:44px}}
.lib-head h1{font-size:clamp(30px,5vw,54px);letter-spacing:-.035em}
.lists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.lcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px;transition:transform .15s, box-shadow .15s;box-shadow:var(--shadow)}
.lcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.lcard:focus-visible{outline:2px solid var(--accent)}
.lcard .cv{aspect-ratio:1;max-width:100%;border-radius:12px;display:grid;place-items:center}
.lcard .cv span{font-size:44px;font-weight:800;letter-spacing:-.04em}
.lcard b{font-size:16px}
.lcard small{color:var(--muted);font-size:13px}
.cv-sug{background:linear-gradient(140deg,#5B8DEF,#2F4FC4);color:#fff}
.cv-fav{background:linear-gradient(140deg,#FF8FA3,#E5484D);color:#fff}
.cv-rev{background:linear-gradient(140deg,#4FD69C,#16A36A);color:#fff}
.cv-c1{background:linear-gradient(140deg,#FFC94D,#FF8A00);color:#4A2600}
.cv-c2{background:linear-gradient(140deg,#7FD6E8,#1E88B6);color:#fff}
.cv-c3{background:linear-gradient(140deg,#B8A2FF,#7C5CFF);color:#fff}
.cv-c4{background:linear-gradient(140deg,#A6E36A,#3E9B2E);color:#fff}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input,.textarea,select.input{width:100%;background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:11px 14px;outline:none;transition:border-color .15s, box-shadow .15s}
.input:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.textarea{min-height:120px;resize:vertical;font-size:18px;font-weight:500;line-height:1.5}

/* ---------- Session ---------- */
.stage{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:22px}
.progress{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#4FD69C);border-radius:999px;transition:width .35s ease;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.phase-tag{display:flex;gap:8px;flex-wrap:wrap}
.flash{perspective:1600px;cursor:pointer}
.flash-inner{position:relative;min-height:340px;transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;border:1px solid var(--card-border);background:var(--surface);box-shadow:var(--shadow);overflow:auto}
.face.front{background:linear-gradient(150deg,var(--hero-1),var(--hero-2));color:#fff;border-color:transparent}
.face.front .ref{font-size:clamp(36px,7vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1}
.face.front .hint{color:rgba(255,255,255,.7);font-size:13px}
.face.back{transform:rotateY(180deg)}
.verse-text{font-size:clamp(21px,3.2vw,28px);font-weight:600;letter-spacing:-.015em;line-height:1.4;text-wrap:pretty}
.ref-line{font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}

.q-card{background:var(--surface);border:1px solid var(--card-border);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow)}
.q-card .ref{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.03em}
.blanks{font-size:clamp(19px,2.8vw,24px);font-weight:500;line-height:2.1}
.blanks input{font-size:inherit;font-weight:600;border:0;border-bottom:3px solid var(--accent);background:var(--accent-soft);border-radius:8px 8px 0 0;padding:0 6px;margin:0 2px;text-align:center;outline:none;max-width:100%}
.blanks input:focus{box-shadow:0 0 0 3px var(--glow)}
.blanks input.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.blanks input.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.blanks .fix{font-size:13px;font-weight:700;color:var(--ok);vertical-align:super;margin-right:4px}
.diff{font-size:20px;font-weight:500;line-height:1.6}
.diff .ok{color:var(--ok)}
.diff .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.diff .near{color:var(--gold-text);text-decoration:underline dotted;text-underline-offset:4px;cursor:help}
.diff .near small{font-size:12px;color:var(--muted);text-decoration:line-through;margin-left:3px}
.blanks input.near{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-text)}
.diff .extra{color:var(--muted);text-decoration:line-through}
.result-bar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px}
.result-bar.ok{background:var(--ok-soft);color:var(--ok)}
.result-bar.mid{background:var(--mid-soft);color:var(--mid)}
.result-bar.bad{background:var(--bad-soft);color:var(--bad)}
.result-bar b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.grade{grid-template-columns:1fr 1fr}}
.grade button{border:2px solid var(--line);background:var(--surface);border-radius:14px;box-shadow:0 2px 0 var(--line);padding:12px 8px;font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center}
.grade button small{font-weight:500;color:var(--muted);font-size:11px}
.grade button:hover{border-color:var(--accent)}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink);margin:0 auto;position:relative}
.mic.live{background:var(--bad);color:#fff}
.mic.live::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.q-ref{transition:filter .35s}
.q-ref.masked{filter:blur(12px);user-select:none}
.ref-field{border-top:1px dashed var(--line);padding-top:16px}
.input.ref-ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.input.ref-bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.hidden-verse{font-size:21px;font-weight:500;line-height:1.5;filter:blur(9px);user-select:none;transition:filter .4s}
.hidden-verse.shown{filter:none;user-select:auto}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;font-weight:700;font-size:16.5px;text-align:left;box-shadow:0 3px 0 var(--line)}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt[disabled]{pointer-events:none}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lvl{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.lvl.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.lvl b{font-size:16px}.lvl small{color:var(--muted);font-size:12.5px}
@media (max-width:560px){.levels{grid-template-columns:1fr}}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.mode:focus-visible{outline:2px solid var(--accent)}
.mode b{font-size:15px}
.mode small{color:var(--muted);font-size:12.5px;line-height:1.35}

/* ---------- Bienvenida / cuenta ---------- */
.wel{min-height:100%;display:grid;place-items:center;padding-inline:clamp(0px,3vw,32px);padding-block:clamp(0px,4vh,40px)}
.wel-card{width:100%;max-width:1040px;min-height:min(640px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.wel-art{position:relative;background:linear-gradient(150deg,var(--hero-1),var(--hero-2));color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;overflow:hidden}
.wel-art::after{content:"";position:absolute;left:-120px;bottom:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--gold) 0%,transparent 62%);opacity:.4;pointer-events:none}
.wel-art .big-quote{font-size:clamp(26px,3vw,36px);font-weight:700;letter-spacing:-.02em;line-height:1.25;position:relative;z-index:1;text-wrap:balance}
.wel-art .big-quote em{color:var(--gold);font-style:normal}
.wel-art .src{font-size:13px;font-weight:700;letter-spacing:.04em;opacity:.7;position:relative;z-index:1}
.wel-main{padding:40px clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:24px;min-width:0}
.wel-main h1{font-size:clamp(32px,4.4vw,48px);letter-spacing:-.04em;line-height:1}
.wel-main h1 em{font-style:normal;color:var(--accent)}
.wel-main .lead{font-size:16px;color:var(--muted);max-width:44ch}
.slide-visual{border-radius:20px;background:var(--surface-2);padding:18px;display:flex;flex-direction:column;gap:10px}
.mini-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini-steps div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.mini-steps b{font-size:14px}.mini-steps small{color:var(--muted);font-size:12px}
.mini-blank{font-size:18px;font-weight:500;line-height:1.8}
.mini-blank span{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px 4px 0 0;margin:0 3px;height:1.2em;vertical-align:-3px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .25s}
.dots i.on{width:22px;background:var(--accent)}
.wel-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.wel-actions .btn{width:100%}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-align:center;padding:8px}
.linkbtn:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.form{display:flex;flex-direction:column;gap:14px}
.form .err{color:var(--bad);font-size:13px;font-weight:600;min-height:1.2em}
.pw{position:relative}.pw .input{padding-right:84px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px}
.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.goal{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.goal[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.goal:focus-visible{outline:2px solid var(--accent)}
.goal b{font-size:20px;font-weight:800;letter-spacing:-.02em}.goal small{color:var(--muted);font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.prev-acc{display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){
  .wel{place-items:stretch;padding:0;background:var(--surface);min-height:100vh;min-height:100dvh}
  .wel-card{grid-template-columns:1fr;border:0;border-radius:0;min-height:100%;box-shadow:none}
  .wel-art{display:none}
  .wel-main{padding:28px 20px calc(24px + env(safe-area-inset-bottom,0px));min-height:100%}
}
/* ---------- Comunidad y temas ---------- */
a.btn{text-decoration:none}
a.btn:not(.primary){color:var(--ink)}
.input::placeholder{text-transform:none}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px}
.drow:hover{background:var(--surface-2)}
.nrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:flex-start;padding:12px;border-radius:12px}
.nrow.unread{background:var(--accent-soft)}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px}
.set-row:has(> .switch),.set-row:has(> .row > .switch){flex-wrap:nowrap}
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.nbadge{position:absolute;top:4px;left:26px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font:700 10px/17px var(--f-ui,inherit);font-style:normal;text-align:center}
.tabbar .nbadge{top:2px;left:calc(50% + 4px)}
.drow b{display:block}
@media (max-width:560px){ .lists-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px} .lcard .cv span{font-size:34px} }
/* ---------- Política ---------- */
.policy{display:flex;flex-direction:column;gap:12px;max-width:68ch;line-height:1.6}
.policy h1{font-size:clamp(28px,5vw,40px)}
.policy h2{font-size:18px;margin-top:10px}
.policy ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* ---------- Perfil ---------- */
.prof-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prof-head .avatar{width:64px;height:64px;font-size:26px}
.set-group{display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 4px;border-top:1px solid var(--line);flex-wrap:wrap}
.set-row:first-child{border-top:0}
.set-row .lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.set-row .lbl small{color:var(--muted);font-size:12.5px}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.danger{color:var(--bad)!important}
.side-foot{cursor:pointer}
/* ---------- Login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:40px}
.login-card{width:100%;max-width:520px;display:flex;flex-direction:column;gap:26px}
.login h1{font-size:clamp(40px,8vw,68px);letter-spacing:-.045em;line-height:.95}
.login h1 em{font-style:normal;color:var(--accent)}
.login .quote{font-size:18px;font-weight:500;line-height:1.4;color:var(--muted);border-left:2px solid var(--accent);padding-left:14px}
.profiles{display:flex;flex-direction:column;gap:8px}
.profile{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.profile:hover{border-color:var(--accent)}
.profile:focus-visible{outline:2px solid var(--accent)}
.profile .avatar{width:42px;height:42px;font-size:17px}
.profile .meta{flex:1;min-width:0}
.profile .meta b{display:block}
.profile .meta small{color:var(--muted);font-size:12.5px}
.cloud-card{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}

/* ---------- Modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,20,.5);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:tin .25s ease}
@media (min-width:821px){.toast{bottom:28px}}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.check input{accent-color:var(--accent);width:18px;height:18px}
.empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:17px}

/* ---------- Estadísticas tipo Instagram ---------- */
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.pstats>*{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--card-border);text-align:center;min-width:0}
.pstats button{cursor:pointer}
.pstats button:focus-visible{outline:2px solid var(--accent)}
.pstats b{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1;display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.pstats b svg{width:20px;height:20px}
.pstats span{font-size:12px;font-weight:600;color:var(--muted)}
.pstats .gold b{color:var(--gold-text)} .pstats .blue b{color:var(--accent)} .pstats .green b{color:var(--ok)}
/* ---------- Racha ---------- */
.streak-hero{position:relative;overflow:hidden;border-radius:26px;padding:24px;background:linear-gradient(150deg,#FFB020,#FF7A00);color:#3A1E00;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(255,138,0,.28)}
.streak-hero .num{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:.9}
.streak-hero .flame-xl{position:absolute;right:-10px;top:-6px;opacity:.28}
.streak-hero .flame-xl svg{width:150px;height:150px;color:#fff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:rgba(255,255,255,.35);border-radius:18px;padding:10px 8px;position:relative}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700}
.week i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);font-style:normal}
.week i.on{background:#fff;color:#FF7A00}
.week i.is-today{outline:3px solid #fff;outline-offset:2px}
.week i svg{width:16px;height:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:14px;font-weight:600;position:relative;max-width:44px;margin:0 auto;width:100%}
.cal .d.on{background:var(--gold);color:var(--gold-ink);font-weight:800}
.cal .d.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.fut{color:var(--none)}
.cal .d.out{visibility:hidden}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mstats div{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.mstats b{font-size:24px;font-weight:800;letter-spacing:-.03em}
.mstats span{font-size:12px;color:var(--muted);font-weight:600}
/* ---------- Camino ---------- */
.xpcard{display:flex;flex-direction:column;gap:10px}
.xpbar{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),#FF8A00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
.lvl-badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(150deg,var(--accent),#6A4BFF);box-shadow:0 3px 0 var(--accent-dark);flex:none}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 20px}
.tier{width:100%;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin:14px 0 8px;color:#fff}
.tier b{font-size:17px;display:block}
.tier small{opacity:.9;font-size:13px}
.tier .em{font-size:28px;line-height:1}
.node{all:unset;box-sizing:border-box;cursor:pointer;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;position:relative;transition:transform .1s}
.node:active{transform:translateY(3px)}
.node.done{background:var(--gold);color:var(--gold-ink);box-shadow:0 6px 0 var(--gold-dark)}
.node.cur{background:var(--accent);color:#fff;box-shadow:0 6px 0 var(--accent-dark),0 0 0 8px var(--glow)}
.node.lock{background:var(--surface-2);color:var(--none);box-shadow:0 6px 0 var(--line);cursor:default}
.node:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.node-label{font-size:12.5px;font-weight:700;color:var(--muted)}
.start-pill{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--accent);border:2px solid var(--line);font-size:12px;font-weight:800;padding:5px 10px;border-radius:10px;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.pdots{display:flex;gap:6px;flex-wrap:wrap}
.pdots i{width:26px;height:8px;border-radius:999px;background:var(--surface-2)}
.pdots i.on{background:var(--ok)}
/* ---------- Libros: filas ---------- */
.divlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
@media (max-width:560px){.divlist{grid-template-columns:1fr}}
.divrow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--card-border);transition:transform .12s}
.divrow:hover{transform:translateY(-1px)}
.divrow:focus-visible{outline:2px solid var(--accent)}
.divrow .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.divrow b{display:block;font-size:15.5px}
.divrow small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- Versículo completo y recorte de foto ---------- */
.verse-full{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.5}
.crop{position:relative;width:min(280px,72vw);aspect-ratio:1;margin:0 auto;border-radius:20px;overflow:hidden;background:#000;touch-action:none;cursor:grab;user-select:none}
.crop img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none}
.crop::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);pointer-events:none;outline:2px solid rgba(255,255,255,.8);outline-offset:-2px}
.zoom{width:100%;accent-color:var(--accent)}
/* ---------- Logros ---------- */
@font-face{font-family:"Yellowtail";font-weight:400;font-display:swap;src:url("fonts/yellowtail-400.woff2") format("woff2")}
@font-face{font-family:"Playfair Display";font-weight:500;font-display:swap;src:url("fonts/playfair-500.woff2") format("woff2")}
@font-face{font-family:"Fraunces";font-weight:600;font-display:swap;src:url("fonts/fraunces-600.woff2") format("woff2")}
@font-face{font-family:"Fraunces";font-weight:900;font-display:swap;src:url("fonts/fraunces-900.woff2") format("woff2")}
/* ---- Recuerda esto: banner en el inicio (≈2 cm) ---- */
.hb{position:relative;overflow:hidden;width:100%;min-height:76px;border:0;border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px 10px 20px;cursor:pointer;color:#fff;text-align:left;font:inherit;background:radial-gradient(75% 170% at 28% 50%,var(--c-mid) 0%,var(--c-light) 90%);box-shadow:0 10px 24px -12px var(--c-mid)}
:root[data-theme="dark"] .hb{box-shadow:0 0 0 1px rgba(255,255,255,.1),0 10px 24px -14px #000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hb{box-shadow:0 0 0 1px rgba(255,255,255,.1),0 10px 24px -14px #000}}
.hb:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hb>*{position:relative;z-index:1}
.hb.closed{animation:hbBreath 3.4s ease-in-out infinite}
.hb.closed::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.32) 50%,transparent 65%);transform:translateX(-120%);animation:hbShine 3.4s ease-in-out infinite;pointer-events:none}
.hb-txt{min-width:0;display:flex;flex-direction:column;gap:5px}
.hb-ey{font:700 10.5px/1.2 Inter,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.92}
.hb-wave{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:27px;line-height:1;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.12)}
.hb-wave .lt{display:inline-block}
.hb-pill{flex:none;display:flex;align-items:center;gap:6px;background:#fff;color:var(--c-ink);border-radius:999px;padding:8px 13px;font:700 13px/1 Inter,system-ui,sans-serif;box-shadow:0 4px 14px -6px rgba(0,0,0,.25)}
.hb-pill svg{width:16px;height:16px}

#heartx.lay-crema{background:#F8F3EA;color:var(--c-ink)}
.hx-blob{position:absolute;left:50%;top:265px;width:min(600px,150vw);aspect-ratio:1/.92;transform:translate(-50%,-50%) rotate(-18deg);border-radius:50%;background:radial-gradient(closest-side,var(--c-mid) 0%,var(--c-mid) 36%,var(--c-light) 70%,rgba(247,244,238,0) 100%);filter:blur(10px);pointer-events:none}
.hx-in{position:relative;z-index:1;width:100%;max-width:460px;min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:max(64px,calc(env(safe-area-inset-top) + 52px)) 22px max(26px,env(safe-area-inset-bottom))}
.hx-close{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:3;background:rgba(255,255,255,.18);color:inherit}
.lay-bruma .hx-close,.lay-crema .hx-close{background:rgba(255,255,255,.88);color:var(--c-ink)}
.hx-ey{font:700 11px/1.4 Inter,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin-bottom:26px}
.lay-bruma .hx-ey{color:var(--c-ink)}
.hx-art{display:flex;flex-direction:column;align-items:center;width:100%;cursor:pointer}
.hx-row{display:block;width:max-content;margin:0 auto;white-space:nowrap}
.hx-caps{font-family:"Playfair Display",Georgia,serif;font-weight:500;text-transform:uppercase;font-size:clamp(22px,7.2vw,30px);line-height:1.14}
.hx-serif{font-family:"Playfair Display",Georgia,serif;font-weight:500;font-size:clamp(23px,7.6vw,32px);line-height:1.16}
.hx-script{font-family:"Yellowtail","Brush Script MT",cursive;font-size:clamp(40px,12.5vw,56px);line-height:1.15;display:inline-block;padding:.06em .4em .16em;margin:0 -.4em;white-space:nowrap}
.hx-wave{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(26px,8.6vw,36px);line-height:1.2;white-space:nowrap}

.hx-wave .lt{display:inline-block}
.lay-bruma .hx-serif{text-shadow:0 1px 14px rgba(0,0,0,.14)}
.hx-ring{position:relative;display:inline-block;margin:16px 0 12px}
.hx-ring::before{content:"";position:absolute;inset:-12% -10%;border:1.3px solid rgba(255,255,255,.85);border-radius:50%;transform:rotate(-8deg)}
.hx-ring .spk{position:absolute;font-style:normal;color:#fff;line-height:1}
.hx-ring .s1{left:-14%;top:-6%;font-size:22px}.hx-ring .s2{right:-12%;bottom:-2%;font-size:20px}.hx-ring .s3{right:-18%;bottom:24%;font-size:12px}
/* aparición: palabra por palabra y la letra cursiva como si se escribiera */
#heartx .w{display:inline-block;opacity:0;transform:translateY(10px);animation:hxWord .5s ease forwards;animation-delay:var(--d)}
#heartx .wr{-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 60%);mask-image:linear-gradient(90deg,#000 40%,transparent 60%);-webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:100% 0;mask-position:100% 0;animation:hxPen var(--t) linear forwards;animation-delay:var(--d)}
#heartx .fd{opacity:0;animation:hxFade .6s ease forwards;animation-delay:var(--d)}
#heartx .hx-ring.rg::before{opacity:0;animation:hxFade .6s ease forwards;animation-delay:var(--d)}
.hx-rest{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:30px}
.hx-verse{width:100%;border-radius:22px;padding:18px 20px;font-style:italic;font-size:16px;line-height:1.6;text-align:left}
.lay-noche .hx-verse{background:rgba(255,255,255,.13);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lay-bruma .hx-verse,.lay-crema .hx-verse{background:rgba(255,255,255,.92);color:#1C2340;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
.hx-ref{display:block;margin-top:10px;font-style:normal;font-size:13.5px;font-weight:600}
.lay-noche .hx-ref{color:rgba(255,255,255,.82)}.lay-bruma .hx-ref,.lay-crema .hx-ref{color:var(--c-ink)}
.hx-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hx-actions .btn{border-color:transparent}
.lay-noche .hx-actions .btn{background:rgba(255,255,255,.16);color:#fff}
.lay-noche .hx-actions .btn.primary{background:#fff;color:var(--c-deep)}
.lay-bruma .hx-actions .btn,.lay-crema .hx-actions .btn{background:#fff;color:var(--c-ink);box-shadow:0 0 0 1.5px var(--c-ink) inset}
.lay-bruma .hx-actions .btn.primary,.lay-crema .hx-actions .btn.primary{background:var(--c-ink);color:#fff;box-shadow:none}
#heartx.done .w,#heartx.done .fd,#heartx.done .hx-ring.rg::before{animation:none;opacity:1;transform:none}
#heartx.done .wr{animation:none;-webkit-mask-image:none;mask-image:none}
@keyframes hxIn{from{opacity:0}to{opacity:1}}
@keyframes hxWord{to{opacity:1;transform:none}}
@keyframes hxPen{to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes hxFade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.hb.closed,.hb.closed::after,.hb-pill svg,.hb .spk{animation:none!important}#heartx .w,#heartx .fd,#heartx .hx-ring.rg::before{animation:none;opacity:1;transform:none}#heartx .wr{animation:none;-webkit-mask-image:none;mask-image:none}}
.shield-chip{display:inline-flex;align-self:flex-start;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--gold-text);background:var(--gold-soft);border-radius:999px;padding:2px 8px}
.cal .d.sh{background:var(--gold-soft);font-size:13px}
.catchup{all:unset;box-sizing:border-box;cursor:pointer;position:relative;z-index:1;align-self:flex-start;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;color:#fff}
.catchup:hover{background:rgba(255,255,255,.26)}.catchup:focus-visible{outline:2px solid #fff;outline-offset:2px}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.medals.one{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));column-gap:6px;grid-template-rows:auto;grid-auto-rows:0;row-gap:0;overflow:hidden}
.fbubbles{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.fbub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex:none;text-align:center}
.fbub:focus-visible{outline:2px solid var(--accent);border-radius:12px}
.fbub .ring{position:relative;padding:3px;border-radius:50%;background:var(--surface-2)}

.fbub .fl{position:absolute;right:-6px;bottom:-4px;background:var(--surface);border-radius:999px;padding:1px 6px 1px 4px;font-size:11px;font-weight:800;color:var(--gold-text);box-shadow:var(--shadow);display:flex;align-items:center;gap:1px}

.medal.on{filter:none;opacity:1;background:radial-gradient(circle at 35% 30%,#FFE7A3,var(--gold) 60%,#E89400);box-shadow:0 4px 0 var(--gold-dark),0 6px 16px rgba(255,176,32,.35)}
.medal.big{width:96px;height:96px;font-size:46px}
.medal-name{font-size:11.5px;font-weight:700;line-height:1.25;color:var(--ink)}
.medal-wrap[data-prog]::after{content:attr(data-prog);font-size:10.5px;font-weight:700;color:var(--muted)}
/* ---------- Animación de apertura ---------- */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
#intro .lampx{position:relative;width:120px;height:120px;z-index:2;}
#intro .lampx svg{width:100%;height:100%;overflow:visible}
#intro .base{fill:var(--gold-dark);transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:partIn .35s cubic-bezier(.2,.8,.2,1) forwards}
#intro .base.b1{animation-delay:.45s}
#intro .base.b2{animation-delay:.7s}
#intro .flame{fill:#FFB020;transform-origin:12px 11px;transform:scale(0);animation:flameOn .5s 1s cubic-bezier(.3,1.6,.5,1) forwards, flicker 1.2s 1.5s ease-in-out infinite}
#intro .core{fill:#FFF3C4;transform-origin:12px 9.5px;transform:scale(0);animation:flameOn .4s 1.1s cubic-bezier(.3,1.6,.5,1) forwards}
#intro .glow{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-62px 0 0 -20px;border-radius:50%;background:radial-gradient(circle,#FFE08A 0%,#FFB020 45%,rgba(255,176,32,0) 70%);transform:scale(0);opacity:0;z-index:1;animation:glowUp .7s 1.25s cubic-bezier(.5,0,.3,1) forwards}
#intro .fill{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-72px 0 0 -30px;border-radius:50%;background:radial-gradient(circle,#FFC94D 0%,#FFB020 45%,#FF9A10 100%);transform:scale(0);z-index:3;animation:fillUp .7s 1.5s cubic-bezier(.6,0,.3,1) forwards}
#intro .word{position:absolute;left:0;right:0;top:calc(50% + 78px);text-align:center;font-weight:800;font-size:26px;letter-spacing:-.03em;color:var(--ink);opacity:0;z-index:4;animation:wordIn .4s .05s ease forwards, wordUp .7s 1.55s cubic-bezier(.5,0,.3,1) forwards}
#intro .word.sub{top:calc(50% + 116px);font-size:15px;font-weight:600;letter-spacing:0;opacity:0;animation-delay:.25s,1.55s}
#intro.out{animation:introOut .45s ease forwards}
@keyframes lampIn{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
@keyframes flameOn{to{transform:scale(1)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.04,.97) rotate(-2deg)}60%{transform:scale(.97,1.05) rotate(2deg)}}
@keyframes glowUp{to{transform:scale(4.5);opacity:1}}
@keyframes fillUp{to{transform:scale(60)}}
@keyframes wordIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes wordUp{from{opacity:1;transform:none}to{opacity:1;color:#fff;transform:translateY(-104px) scale(1.15);text-shadow:0 1px 2px rgba(140,70,0,.35),0 3px 16px rgba(140,70,0,.45)}}
@keyframes partIn{from{opacity:0;transform:translateY(8px) scaleX(.6)}to{opacity:1;transform:none}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =========================================================
   MOTOR DE REPETICIÓN ESPACIADA
   ========================================================= */
function applyResult(id, score){
  const now = Date.now();
  setTimeout(markToday, 0);
  const p = S.progress[id] || { box:0, due:now, reps:0, lapses:0, last:0, introduced:now, hist:[] };
  const wasDue = p.reps===0 || dayStart(p.due) <= now;
  let outcome;
  if(score>=0.9){
    outcome = "ok";
    if(wasDue) p.box = Math.min(5, p.box+1);         // solo sube de nivel si tocaba repasarlo (evita "atiborrarse")
    p.due = dayStart(now, INTERVAL_DAYS[p.box]);
  } else if(score>=0.6){
    outcome = "mid";
    p.box = Math.max(1, Math.min(p.box, MASTER-1));  // casi: se queda en proceso
    p.due = dayStart(now, 1);                         // casi: vuelve mañana
  } else {
    outcome = "bad";
    p.lapses++;
    p.box = p.box>=MASTER ? 1 : 0;                   // si era memorizado y falla, regresa a práctica
    p.due = now;
  }
  p.reps++; p.last = now;
  p.hist = (p.hist||[]).concat(Math.round(score*100)).slice(-12);
  S.progress[id] = p;
  const k = todayKey();
  const L = S.log[k] || { n:0, sum:0 };
  L.n++; L.sum += score; S.log[k] = L;
  return outcome;
}
function maybeUnlock(){
  const struggling = activeIds().filter(id=>{ const p=prog(id); return !p || p.box<2; }).length;
  if(struggling < 3 && S.unlocked < SUGGESTED.length){
    const before = S.unlocked;
    S.unlocked = Math.min(SUGGESTED.length, S.unlocked+UNLOCK_STEP);
    return S.unlocked-before;
  }
  return 0;
}
/* Un día cuenta para la racha si practicaste o si un escudo lo protegió */
const shieldDay = k => (S.shieldDays||[]).includes(k);
const streakDay = k => !!(S.log[k] && S.log[k].n) || shieldDay(k);
function streak(){
  let d = new Date(); let n = 0;
  if(!streakDay(todayKey(d))) d = new Date(Date.now()-DAY);
  while(streakDay(todayKey(d))){ n++; d = new Date(d.getTime()-DAY); }
  return n;
}
/* ESCUDOS DE RACHA: ganas uno cada 7 días seguidos (máximo 2) y se usan solos si un día no practicas */
const SHIELD_MAX = 2;
function checkShields(){
  if(!S) return;
  S.shields = S.shields || 0; S.shieldDays = S.shieldDays || [];
  let changed = false, used = 0;
  // 1) proteger los días que faltaron (desde ayer hacia atrás) si alcanzan los escudos
  if(S.shields > 0){
    const gap = []; let d = new Date(Date.now()-DAY), guard = 0;
    while(!streakDay(todayKey(d)) && guard < 3){ gap.push(todayKey(d)); d = new Date(d.getTime()-DAY); guard++; }
    if(gap.length && gap.length <= S.shields && streakDay(todayKey(d))){
      S.shieldDays = S.shieldDays.concat(gap).slice(-60); S.shields -= gap.length; used = gap.length; changed = true;
    }
  }
  // 2) ganar un escudo al completar 7, 14, 21… días seguidos
  const st = streak(), k = todayKey();
  if(practicedToday() && st > 0 && st % 7 === 0 && S.shieldAward !== k){
    S.shieldAward = k; changed = true;
    if(S.shields < SHIELD_MAX){ S.shields++; setTimeout(()=>shieldModal("earned"), 600); }
  }
  if(changed){ persist(); }
  if(used) setTimeout(()=>shieldModal("used", used), 500);
}

function accuracy(days=30){

  return n? Math.round(sum/n*100) : null;
}
/* Elige versículos al azar, con más probabilidad para los de menor nivel,
   los que tocan repaso, los que más fallas y los que no salieron en las últimas sesiones */
function pickWeight(id, now){
  const p = prog(id); const box = p ? p.box : 0;
  let w = 6 - box;                                   // nivel 0 pesa 6, nivel 5 pesa 1
  if(isDue(id,now)) w *= 3;
  if(p && p.lapses) w *= 1 + Math.min(p.lapses,3)*0.3;
  const r = (S.recent||[]).indexOf(id);
  if(r>=0) w *= r < SESSION_SIZE ? 0.15 : 0.45;      // salió hace poco: baja mucho su probabilidad
  return w * (0.6 + Math.random()*0.8);
}
function weightedSample(ids, size, now){
  const pool = ids.slice(); const out = [];
  while(out.length<size && pool.length){
    const ws = pool.map(id=>pickWeight(id,now)); const tot = ws.reduce((a,b)=>a+b,0);
    let r = Math.random()*tot, k = 0;
    while(k<ws.length-1 && (r -= ws[k]) > 0) k++;
    out.push(pool.splice(k,1)[0]);
  }
  return out;
}
function dueIds(ids){ const now=Date.now(); return shuffle(ids.filter(id=>isDue(id,now))); }
let GROWN = 0;
/* Arma cada sesión con versículos distintos a la anterior:
   - los de la sesión pasada descansan (salvo los que fallaste, que vuelven, máximo un tercio)
   - los ya aprendidos se guardan para su repaso programado
   - si no hay suficientes distintos, se agregan versículos sugeridos nuevos */
function buildQueue(ids, {grow=false, size=S.prefs.size}={}){
  const now = Date.now(); GROWN = 0;
  const last = new Set(S.lastIds||[]), failed = new Set(S.lastFailed||[]);
  const avoid = id => last.has(id) && !failed.has(id);
  const resting = id => status(id)==="ok" && !isDue(id,now);
  let fresh = ids.filter(id=>!avoid(id) && !resting(id));
  const want = Math.ceil(size*0.6);
  const need = Math.max(want-fresh.length, size-ids.length);
  fresh = limitNew(fresh, Math.min(3, fresh.length));
  if(grow && need>0 && S.unlocked<SUGGESTED.length && newBudget()>0){
    const before = S.unlocked;
    S.unlocked = Math.min(SUGGESTED.length, S.unlocked + Math.min(10, need));
    const added = SUGGESTED.slice(before, S.unlocked).map(r=>r[0]);
    ids = ids.concat(added); fresh = fresh.concat(added); GROWN = added.length;
  }
  const failedNow = fresh.filter(id=>failed.has(id));
  let pick = weightedSample(failedNow, Math.min(failedNow.length, Math.ceil(size/3)), now);
  const rest = fresh.filter(id=>!pick.includes(id));
  pick = pick.concat(weightedSample(rest.filter(id=>isDue(id,now)), size-pick.length, now));
  if(pick.length<size) pick = pick.concat(weightedSample(rest.filter(id=>!pick.includes(id)), size-pick.length, now));
  if(pick.length<size) pick = pick.concat(weightedSample(ids.filter(id=>!pick.includes(id) && !resting(id)), size-pick.length, now));
  if(pick.length<size) pick = pick.concat(weightedSample(ids.filter(id=>!pick.includes(id)), size-pick.length, now));
  return shuffle(pick);
}
function rememberSession(ids, failed){
  S.lastIds = ids.slice();
  S.lastFailed = failed || [];
  S.recent = ids.concat((S.recent||[]).filter(x=>!ids.includes(x))).slice(0, SESSION_SIZE*3);
}

function wrapLines(g, text, maxW){ const words = text.split(" "), lines = []; let cur = ""; words.forEach(w=>{ const t = cur ? cur + " " + w : w; if(g.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }); if(cur) lines.push(cur); return lines; }
function star(g, x, y, r){ g.beginPath(); g.moveTo(x, y-r); g.quadraticCurveTo(x, y, x+r, y); g.quadraticCurveTo(x, y, x, y+r); g.quadraticCurveTo(x, y, x-r, y); g.quadraticCurveTo(x, y, x, y-r); g.fill(); }

function ring(pct, size=92, stroke=10){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${pct}% aprendido">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ok)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="${size*.24}">${pct}%</text></svg>`;
}
function activityChart(){
  const days = 14, W=560, H=150, pad={l:26,r:8,t:12,b:24};
  const data = [];
  for(let i=days-1;i>=0;i--){ const d=new Date(Date.now()-i*DAY); const L=S.log[todayKey(d)]; data.push({d, n:L?L.n:0, acc:L?L.sum/L.n:0}); }
  const max = Math.max(4, ...data.map(x=>x.n));
  const step = Math.ceil(max/4); const top = step*4;
  const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b, bw = iw/days;
  const y = v => pad.t + ih - (v/top)*ih;
  let g = "";
  for(let t=0;t<=top;t+=step){ g += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="${t?'2 4':''}"/><text x="${pad.l-6}" y="${y(t)+3}" text-anchor="end">${t}</text>`; }
  const dn = ["D","L","M","M","J","V","S"];
  data.forEach((x,i)=>{
    const h = (x.n/top)*ih, bx = pad.l+i*bw+bw*.18, w = bw*.64;
    const col = x.n ? (x.acc>=.9?"var(--ok)":x.acc>=.6?"var(--mid)":"var(--bad)") : "var(--surface-2)";
    g += `<rect x="${bx}" y="${x.n?y(x.n):y(0)-3}" width="${w}" height="${x.n?h:3}" rx="4" fill="${col}"><title>${todayKey(x.d)}: ${x.n} preguntas${x.n?`, ${Math.round(x.acc*100)}% de acierto`:''}</title></rect>`;
    g += `<text x="${bx+w/2}" y="${H-8}" text-anchor="middle" ${i===days-1?'fill="var(--ink)" font-weight="700"':''}>${i===days-1?'Hoy':dn[x.d.getDay()]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* =========================================================
   SESIÓN DE PRÁCTICA
   Fase 1: tarjetas (repaso) · Fase 2: preguntas · Fase 3: resumen
   ========================================================= */
/* Duración de la sesión → cantidad de versículos (≈ 1,6 min por versículo: tarjeta + pregunta + cita) */
const MINUTES = [5,10,15,20,30];
const versesFor = m => Math.max(2, Math.round(m/1.6));
function sessionSize(){ return versesFor(S.prefs.minutes||10); }
function pickFor(source, listId){
  const size = sessionSize();
  if(source==="rev"){
    const ids = activeIds().filter(id=>status(id)==="ok");
    const last = new Set(S.lastIds||[]); const fr = ids.filter(id=>!last.has(id));
    return shuffle(weightedSample(fr.length>=Math.min(size,ids.length)?fr:ids, size, Date.now()));
  }
  if(source==="active") return buildQueue(activeIds(),{grow:true,size});
  if(source==="sug") return buildQueue(activeIds().filter(id=>!S.favs.includes(id)),{grow:true,size});
  if(String(source).startsWith("topic:")){ const t = TOPIC_MAP[String(source).slice(6)]; return t ? buildQueue(t.ids, { size }) : []; }
  const l = getList(listId||source);
  return l ? buildQueue(l.ids,{size}) : [];
}
function startPath(){
  const k = currentStage();
  if(k >= stageCount()){ startSession(pickFor("active"),{title:"Práctica", source:"active"}); return; }
  startSession(pathQueue(sessionSize()), { title:`Camino · Etapa ${k+1}`, source:"path" });
  persist();
}
function startSession(ids, {title, review=false, listId=null}={}){
  if(!ids.length){ toast("No hay versículos para practicar en esta lista."); return; }
  if(GROWN){ toast(`Agregamos ${GROWN} ${GROWN===1?"versículo nuevo":"versículos nuevos"} para variar tu práctica.`); GROWN = 0; }
  SESSION = { ids, source: arguments[1]&&arguments[1].source || ids, title, review, listId, phase:"setup", i:0, mode:S.prefs.mode, results:[], flipped:false, q:null, unlocked:0, xp:0, stageBefore:currentStage() };
  VIEW = { name:"session" };
  render();
}
function cardIdsFor(ids){ const failed=new Set(S.lastFailed||[]), t=diffTier(), lim = t<=1 ? 3 : t<=3 ? 2 : 1; return ids.filter(id=>{ const p=prog(id); return !p || p.box<lim || failed.has(id); }); }
function modeFor(id){
  const m = SESSION.mode;
  if(m!=="mixto") return m;
  if(SESSION.modes && SESSION.modes[id]) return SESSION.modes[id];
  const b = (prog(id)||{box:0}).box, t = diffTier();
  if(b===0) return "blanks";
  if(b<=2) return t>=2 && b===2 ? "write" : t>=4 ? (Math.random()<.5?"write":"blanks") : "blanks";
  if(b===3) return t>=3 && Math.random()<.4 ? "recite" : "write";
  return Math.random()<.5 ? "write" : "recite";
}
function blankRatio(id){ const b=(prog(id)||{box:0}).box; return Math.min(.95, [.3,.45,.65,.85,.9,.95][b] + diffTier()*0.04); }

/* ---------- Construcción de preguntas ---------- */
/* Las preguntas de cita se mezclan al azar entre las demás, siempre con otras preguntas de por medio */
function buildTasks(ids){
  const tasks = ids.map(id=>({ type:"text", id }));
  shuffle(ids).forEach(id=>{
    const p = tasks.findIndex(x=>x.type==="text" && x.id===id);
    const min = Math.min(tasks.length, p+3);
    const pos = min + Math.floor(Math.random()*(tasks.length-min+1));
    tasks.splice(pos, 0, { type:"ref", id });
  });
  return tasks;
}
function startQuiz(){
  const s = SESSION;
  s.phase = "quiz"; s.tasks = buildTasks(shuffle(s.ids)); s.t = 0; s.pending = {}; s.spoken = {};
  s.modes = {};
  if(s.mode==="mixto" && ritmo()==="tranquilo"){
    // Ritmo tranquilo: casi todo es completar espacios; cada 2 días aparece un reto de escribir o recitar un versículo completo
    s.ids.forEach(id=>s.modes[id] = "blanks");
    const daysSince = S.lastChallenge ? Math.round((new Date(todayKey()) - new Date(S.lastChallenge))/DAY) : 99;
    const cand = s.ids.filter(id=>(prog(id)||{box:0}).box>=1);
    if(daysSince>=2 && cand.length){                       // solo con versículos que ya practicaste
      const id = cand[Math.floor(Math.random()*cand.length)];
      const kind = S.challengeKind==="write" ? "recite" : "write";
      s.modes[id] = kind; s.challenge = id; S.challengeKind = kind; S.lastChallenge = todayKey();
    }
  } else if(s.mode==="mixto"){
    // Reparte los tres tipos en la sesión: espacios para los de menor nivel, escribir en el medio, recitar para los más avanzados (con algo de azar)
    const sorted = s.ids.map(id=>({ id, k:((prog(id)||{box:0}).box) + Math.random()*1.5 })).sort((a,b)=>a.k-b.k).map(x=>x.id);
    // La proporción depende de la fase del camino: al principio más espacios, después más escribir y recitar
    const n = sorted.length, t = diffTier();
    const pb = Math.max(0.15, 0.5 - 0.07*t), pr = Math.min(0.4, 0.17 + 0.045*t);
    const counts = { blanks: Math.round(n*pb), recite: Math.round(n*pr) };
    if(n>=3){ counts.blanks = Math.max(1, counts.blanks); counts.recite = Math.max(1, counts.recite); }
    counts.write = Math.max(0, n - counts.blanks - counts.recite);
    if(n>=3 && !counts.write){ if(counts.blanks>1) counts.blanks--; else counts.recite--; counts.write = 1; }
    let k = 0; ["blanks","write","recite"].forEach(t=>{ for(let c=0;c<counts[t];c++) s.modes[sorted[k++]] = t; });
  }
  prepQuestion();
}
function prepQuestion(){
  const s = SESSION; const task = s.tasks[s.t]; const id = task.id; const v = verse(id);
  if(task.type==="ref"){ s.q = { id, stage:"ref", done:false, spokenRef: s.spoken[id]||"" }; return; }
  const mode = modeFor(id);
  const q = { id, mode, stage:"text", textDone:false, textScore:0, done:false, score:null, transcript:"", spokenRef:"" };
  if(mode==="blanks"){
    const toks = v.text.split(/(\s+)/);
    const cand = [];
    toks.forEach((t,i)=>{ const w=norm(t); if(w && w.length>=3) cand.push(i); });
    const nb = Math.max(1, Math.round(cand.length*blankRatio(id)));
    const pick = new Set(shuffle(cand).slice(0,nb));
    q.toks = toks; q.blanks = [...pick].sort((a,b)=>a-b);
  }
  s.q = q;
}

function afterQuizRender(){

    });
    if(ins[0]) ins[0].focus();
  } else if(q.mode==="write"){ const w=$("#writeBox"); if(w) w.focus(); }

/* ---------- Cita bíblica ---------- */
function parseRef(s){
  let t = " "+norm(s)+" ";
  t = t.replace(/ (primera|primer|1ra|1a|i) /g," 1 ").replace(/ (segunda|segundo|2da|2a|ii) /g," 2 ").replace(/ (tercera|tercero|3ra|3a|iii) /g," 3 ").trim();
  const nums = t.match(/\d+/g) || [];
  const stop = ["de","del","capitulo","cap","versiculo","versiculos","vers","al","y","v"];
  const book = (t.replace(/\d+/g," ").match(/[a-zñ]+/g)||[]).filter(w=>!stop.includes(w)).join("");
  const lead = /^\d+\s*[a-zñ]/.test(t) ? nums[0] : null;
  return { book, lead, nums: lead ? nums.slice(1) : nums };
}
function refMatch(target, ans){
  const a = parseRef(ans), b = parseRef(target);
  if(a.book.length<2 || !a.nums.length) return false;
  const bookOk = a.book.slice(0,3)===b.book.slice(0,3) || (a.book.length>=2 && b.book.startsWith(a.book));
  return bookOk && (a.lead||"")===(b.lead||"") && a.nums.join(":")===b.nums.join(":");
}

/* ---------- Corrección ---------- */
function lcsAlign(target, answer, eq){
  eq = eq || ((t,a)=>close(a,t));
  const n=target.length, m=answer.length;
  const dp = Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = eq(target[i],answer[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<n && j<m){
    if(eq(target[i],answer[j])){ ops.push({t:"ok",w:i,a:j}); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ ops.push({t:"miss",w:i}); i++; }
    else { ops.push({t:"extra",a:j}); j++; }
  }
  while(i<n){ ops.push({t:"miss",w:i}); i++; }
  while(j<m){ ops.push({t:"extra",a:j}); j++; }
  return { lcs:dp[0][0], ops };
}
function scoreFreeText(text, attempt){
  const tw = words(text), aw = words(attempt);
  if(!aw.length) return { score:0, html:"" };
  const { lcs, ops } = lcsAlign(tw, aw);
  const score = (2*lcs)/(tw.length+aw.length);
  const disp = text.split(/\s+/);   // palabras originales para mostrar
  const html = ops.map(o=> o.t==="extra" ? `<span class="extra">${esc(attempt.split(/\s+/).filter(x=>norm(x))[o.a]||"")}</span>` : `<span class="${o.t}">${esc(disp[o.w]||"")}</span>`).join(" ");
  return { score, html };
}
/* Recitación: el reconocimiento de voz "moderniza" el español de la RVR1960
   (pedid → pedí/pedir, hallaréis → allá reís/hallarás, os → los/nos, buscad → buscar).
   Aceptamos esas formas para no marcar como error lo que sí dijiste bien. */
const OS_LIKE = ["os","los","nos","o","vos","us","hos","oz","dos"];
function spokenVariants(w){
  const v = new Set([w]); let m;
  if(w==="os") OS_LIKE.forEach(x=>v.add(x));
  if(w==="vosotros") ["ustedes","nosotros","vosotras"].forEach(x=>v.add(x));
  if((m = w.match(/^(.{2,})([aei])d$/))){ const s0 = m[1], vw = m[2]; [vw+"r", vw, vw+"n", vw+"s", "en", "an", "a", "e"].forEach(e=>v.add(s0+e)); }      // pedid, buscad, llamad
  if((m = w.match(/^(.{2,})reis$/))){ ["ras","ran","rais","re","res","ren"].forEach(e=>v.add(m[1]+e)); }                                                  // hallaréis, seréis
  else if((m = w.match(/^(.{2,})([aei])is$/))){ [m[2]+"s", m[2]+"n", "es", "as", "an", "en"].forEach(e=>v.add(m[1]+e)); }                               // estáis, sabéis
  if((m = w.match(/^(.{2,})os$/)) && /(aos|eos|ios)$/.test(w)){ v.add(m[1]+"se"); }                                                                        // amaos → amarse
  if(w.startsWith("h")) v.add(w.slice(1));                                                                                                                 // la h no suena
  return v;
}
function spokenEq(t, a){
  if(t===a) return true;
  if(spokenVariants(t).has(a)) return true;
  if(t.length>=7 && lev(t,a)<=2) return true;
  if(t.length>=4 && lev(t,a)<=1) return true;
  return false;
}
function scoreSpoken(text, attempt){
  const tw = words(text);
  let aw = words(attempt);
  if(!aw.length) return { score:0, html:"" };
  // unir palabras que el reconocimiento partió en dos ("allá reís" → "allareis")
  const merged = [];
  for(let i=0;i<aw.length;i++){
    const j = aw[i] + (aw[i+1]||"");
    if(aw[i+1] && !tw.some(t=>spokenEq(t,aw[i])) && tw.some(t=>spokenEq(t,j))){ merged.push(j); i++; }
    else merged.push(aw[i]);
  }
  aw = merged;
  const { lcs, ops } = lcsAlign(tw, aw, spokenEq);
  const score = (2*lcs)/(tw.length+aw.length);
  const disp = text.split(/\s+/);
  const html = ops.map(o=> o.t==="extra" ? `<span class="extra">${esc(aw[o.a]||"")}</span>` : `<span class="${o.t}">${esc(disp[o.w]||"")}</span>`).join(" ");
  return { score, html };
}
/* Escritura estricta: cuentan tildes y signos de puntuación (no las mayúsculas).
   Palabra exacta = 1 punto · misma palabra con tilde o signo distinto = medio punto */
const strictTok = w => String(w).toLowerCase().replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'");
const bareTok = w => strictTok(w).replace(/[^a-záéíóúüñ0-9]/g,"");
function errKind(target, got){
  if(bareTok(target)===bareTok(got)) return "puntuación";
  if(norm(target)===norm(got)) return "tilde";
  return "ortografía";
}
function scoreStrict(text, attempt){
  const tRaw = text.split(/\s+/).filter(Boolean);
  const aRaw = attempt.trim().split(/\s+/).filter(Boolean);
  if(!aRaw.length) return { score:0, html:"", errs:0 };
  const { ops } = lcsAlign(tRaw.map(norm), aRaw.map(norm));
  let credit = 0, errs = 0;
  const html = ops.map(o=>{
    if(o.t==="extra") return `<span class="extra">${esc(aRaw[o.a])}</span>`;
    if(o.t==="miss") return `<span class="miss">${esc(tRaw[o.w])}</span>`;
    const tw = tRaw[o.w], aw = aRaw[o.a];
    // El versículo puede terminar en coma o punto y coma porque la frase sigue en el siguiente; terminarlo con punto (o sin signo) también vale
    const lastT = o.w===tRaw.length-1 && /[,;:]$/.test(tw) && o.a===aRaw.length-1 && strictTok(tw.replace(/[,;:]$/,""))===strictTok(aw.replace(/[.,;:]$/,""));
    if(strictTok(tw)===strictTok(aw) || lastT){ credit += 1; return `<span class="ok">${esc(tw)}</span>`; }
    credit += 0.5; errs++;
    return `<span class="near" title="Error de ${errKind(tw,aw)}">${esc(tw)}<small>${esc(aw)}</small></span>`;
  }).join(" ");
  // las operaciones "ok" se alinearon por palabra base; recorrerlas en orden de aparición
  return { score: (2*credit)/(tRaw.length+aRaw.length), html, errs };
}
function feedbackHTML(score){
  const pct = Math.round(score*100);
  const cls = score>=.9?"ok":score>=.6?"mid":"bad";
  const msg = score>=.9?"¡Excelente! Sube de nivel.":score>=.6?"Casi. Lo verás de nuevo pronto.":"Sigue practicando. Vuelve a tu lista de práctica.";
  return `<div class="result-bar ${cls}"><b>${pct}%</b><span>${msg}</span></div>`;
}
/* Parte 1: califica el texto y pasa a la sección de la cita */
function gradeText(score, extraHTML=""){
  const s = SESSION, q = s.q;
  if(q.textDone) return;
  q.textDone = true; q.textScore = score; s.pending[q.id] = score;
  s.textInfo = s.textInfo || {}; s.textInfo[q.id] = { mode:q.mode, detail: q.detailHTML || "" };
  const v = verse(q.id);
  const pct = Math.round(score*100);
  const cls = score>=.9?"ok":score>=.6?"mid":"bad";
  $("#feedback").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="result-bar ${cls}"><b>${pct}%</b><span>en el texto. Más adelante te preguntaremos la cita de este versículo.</span></div>${extraHTML}
    ${q.mode!=="recite"?`<p class="muted" style="font-size:13px">Texto correcto:</p><p class="verse-text" style="font-size:20px">${esc(v.text)}</p>`:""}
    <div class="row"><span style="flex:1"></span><button class="btn primary" id="nextQ" data-act="next-q">Siguiente pregunta</button></div></div>`;
  root.querySelectorAll(".q-card > .row").forEach(r=>r.remove());
  const n = $("#nextQ"); if(n) n.focus();
}
/* Parte 2: califica la cita y registra el resultado final */
function checkRef(giveUp=false){
  const q = SESSION.q; if(!q || q.done) return;
  const v = verse(q.id); const rb = $("#refBox");
  if(!giveUp && !rb.value.trim()){ toast("Escribe la cita o toca “No la recuerdo”."); rb.focus(); return; }
  const ok = !giveUp && refMatch(v.ref, rb.value);
  rb.disabled = true; rb.classList.add(ok?"ref-ok":"ref-bad");
  const ts = SESSION.pending[q.id] ?? 0;
  const score = ok ? ts : Math.min(ts*0.85, 0.85);   // sin la cita correcta no sube de nivel
  const refHTML = `<div class="result-bar ${ok?"ok":"bad"}" style="padding:10px 16px"><span>${ok?"Cita correcta:":"La cita correcta es"} <b style="font-size:inherit">${esc(v.ref)}</b>${ok||giveUp?"":` · escribiste “${esc(rb.value.trim())}”`}</span></div>`;
  finalize(score, refHTML);
}
function finalize(score, extraHTML=""){
  const s = SESSION, q = s.q;
  if(q.done) return;
  q.done = true; q.score = score;
  const before = status(q.id);
  const outcome = applyResult(q.id, score);
  const xp = xpFor(score, q.mode); gainXP(xp);
  s.results.push({ id:q.id, score, outcome, before, after:status(q.id), xp });
  persist();
  const tsPct = Math.round((s.pending[q.id] ?? 0)*100);
  const info = (s.textInfo||{})[q.id] || {};
  const textPart = q.type==="ref" || s.tasks[s.t].type==="ref" ? `
    <details class="panel" style="padding:12px 16px;box-shadow:none;background:var(--surface-2)" ${tsPct<90?"open":""}>
      <summary style="cursor:pointer;font-weight:700">Texto del versículo: ${tsPct}%${tsPct>=100?" ✓":tsPct>=90?" · casi perfecto":" · toca para ver qué faltó"}</summary>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        ${info.detail?`<span class="muted" style="font-size:13px">${info.mode==="write"?"Lo que escribiste comparado con el texto:":"Palabras que no coincidieron:"}</span>${info.detail}`:""}
        <span class="muted" style="font-size:13px">Texto correcto:</span><p style="font-size:17px;font-weight:600;line-height:1.5;margin:0">${esc(verse(q.id).text)}</p>
      </div>
    </details>` : "";
  $("#feedback").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${extraHTML}${feedbackHTML(score)}<p class="muted" style="font-size:13px;margin:0">El resultado de ${esc(verse(q.id).ref)} une lo que escribiste del texto (${tsPct}%) y la cita.</p>${textPart}
    <div class="row"><span style="flex:1"></span><button class="btn primary" id="nextQ" data-act="next-q">${s.t<s.tasks.length-1?"Siguiente pregunta":"Ver resultados"}</button></div></div>`;
  root.querySelectorAll(".q-card > .row").forEach(r=>r.remove());
  const n = $("#nextQ"); if(n) n.focus();
}
function checkAnswer(){
  const q = SESSION.q; if(!q || q.textDone) return;
  const v = verse(q.id);
  if(q.mode==="blanks"){
    let ok = 0;
    q.blanks.forEach(i=>{
      const el = root.querySelector(`[data-blank="${i}"]`);
      const exact = el.value.trim() && bareTok(el.value)===bareTok(q.toks[i]);
      const near = !exact && norm(el.value) && close(norm(el.value), norm(q.toks[i]));
      const right = exact;
      ok += exact ? 1 : near ? 0.5 : 0;
      el.classList.add(exact?"right":near?"near":"wrong"); el.disabled = true;
      if(!right){ const fix=document.createElement("span"); fix.className="fix"; fix.textContent=q.toks[i].replace(/[.,;:!?¿¡"«»()]/g,""); el.after(fix); q.misses=(q.misses||[]).concat({ want:q.toks[i].replace(/[.,;:!?¿¡"«»()]/g,""), got:el.value.trim() }); }
    });
    if(q.misses && q.misses.length) q.detailHTML = `<p style="font-size:14px">${q.misses.map(m=>`<span class="chip bad" style="margin:2px">${m.got?`<s>${esc(m.got)}</s> → `:""}${esc(m.want)}</span>`).join(" ")}</p>`;
    gradeText(ok/q.blanks.length);
  } else if(q.mode==="write"){
    const val = $("#writeBox").value;
    if(!val.trim()){ toast("Escribe el versículo o toca “No lo sé”."); return; }
    const r = scoreStrict(v.text, val);
    $("#writeBox").disabled = true;
    q.detailHTML = `<p class="diff" style="font-size:17px">${r.html}</p>`;
    gradeText(r.score, `<div><p class="muted" style="font-size:13px;margin-bottom:4px">Tu respuesta comparada: <span style="color:var(--ok)">correcto</span> · <span style="color:var(--accent)">tilde, signo u ortografía</span> (tu versión tachada al lado) · <span style="color:var(--bad)">faltó</span> · <span style="text-decoration:line-through">sobró</span></p><p class="diff">${r.html}</p>${r.errs?`<p class="muted" style="font-size:13px;margin-top:6px">${r.errs} ${r.errs===1?"palabra tiene":"palabras tienen"} errores de tilde o puntuación (cuentan medio punto).</p>`:""}</div>`);
  }
}

let REC = null;
function startMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const msg = $("#micMsg"), btn = $("#micBtn"), tr = $("#transcript");
  if(!SR){ msg.textContent = "Tu navegador no ofrece reconocimiento de voz aquí. Recita en voz alta y luego toca “Mostrar y evaluarme”."; return; }
  if(REC){ try{REC.stop();}catch(e){} return; }
  try{
    REC = new SR(); REC.lang = "es-ES";   // el español de España usa "vosotros/os/pedid", como la RVR1960 REC.continuous = true; REC.interimResults = true;
    let finalText = "";
    REC.onresult = e => { let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalText += r[0].transcript+" "; else interim += r[0].transcript; } SESSION.q.transcript = finalText+interim; tr.textContent = SESSION.q.transcript; };
    REC.onerror = e => { msg.textContent = (e.error==="not-allowed"||e.error==="service-not-allowed") ? "No hay permiso para el micrófono. Permítelo en el navegador (ícono junto a la dirección) o recita en voz alta y toca “Mostrar y evaluarme”." : e.error==="no-speech" ? "No se escuchó nada. Toca el micrófono e inténtalo otra vez." : "No se pudo escuchar bien. Puedes intentarlo de nuevo o evaluarte tú."; };
    REC.onend = () => { btn.classList.remove("live"); REC = null; if(SESSION && SESSION.q && !SESSION.q.done){ { const m=(SESSION.q.transcript||"").match(/((?:primera|segunda|tercera|1|2|3)\s+)?[a-záéíóúñ]+\s+\d+(?:\s*(?::|,|versículo|versiculo|y)?\s*\d+)+\s*$/i); if(m){ SESSION.q.spokenRef=m[0].trim(); SESSION.spoken[SESSION.q.id]=m[0].trim(); } } } if(SESSION && SESSION.q && SESSION.q.transcript.trim()) msg.textContent = "Listo. Toca “Mostrar y evaluarme” para ver tu resultado."; };
    REC.start(); btn.classList.add("live"); msg.textContent = "Escuchando… toca de nuevo para terminar.";
  }catch(e){ REC=null; msg.textContent = "El micrófono no está disponible en esta vista. Recita en voz alta y luego evalúate."; }
}
function reveal(){
  const q = SESSION.q; const v = verse(q.id);
  if(q.textDone) return;
  if(REC){ try{REC.stop();}catch(e){} }
  $("#hv").classList.add("shown");
  if(q.transcript && q.transcript.trim()){
    const tx = q.transcript.replace(/((?:primera|segunda|tercera|1|2|3)\s+)?[a-záéíóúñ]+\s+\d+(?:\s*(?::|,|versículo|versiculo|y)?\s*\d+)+\s*$/i,"");
    const r = scoreSpoken(v.text, tx);

    return;
  }
